<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملف الشخصي</title>
    <link rel="stylesheet" href="style.css">

<style>
/* Premium Dark — الأيقونات الأصلية محفوظة */
html,body{
  margin:0;
  min-height:100%;
  background:#050706;
}
body.nav-body{
  min-height:100vh;
  overflow-x:hidden;
}

/* Profile */
.profile-card{
  position:relative;
  overflow:hidden;
  isolation:isolate;
  max-width:620px!important;
  margin-left:auto!important;
  margin-right:auto!important;
  padding:24px!important;
  border-radius:30px!important;
  border:1px solid rgba(183,255,60,.20)!important;
  background:
    radial-gradient(circle at 15% 5%,rgba(183,255,60,.075),transparent 30%),
    linear-gradient(145deg,#111710,#080c09 68%,#0d120e)!important;
  box-shadow:0 25px 65px rgba(0,0,0,.50),inset 0 1px 0 rgba(255,255,255,.045)!important;
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

.profile-card::before{
  content:"";
  position:absolute;
  inset:-1px;
  border-radius:31px;
  padding:1px;
  background:linear-gradient(135deg,rgba(183,255,60,.32),transparent 32%,transparent 70%,rgba(183,255,60,.10));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  pointer-events:none;
}

.profile-card::after{
  content:"";
  position:absolute;
  width:190px;height:190px;
  right:-100px;top:-100px;
  border-radius:50%;
  background:rgba(183,255,60,.065);
  filter:blur(30px);
  pointer-events:none;
}

.profile-header{position:relative;z-index:1;}

.user-avatar{
  width:82px!important;height:82px!important;
  display:grid!important;place-items:center!important;
  margin:0 auto 12px!important;
  border-radius:50%!important;
  background:radial-gradient(circle,#121a25,#0d1118 70%)!important;
  border:1px solid rgba(0,145,255,.55)!important;
  box-shadow:0 0 0 5px rgba(0,145,255,.04),0 0 28px rgba(0,145,255,.20),inset 0 0 22px rgba(0,145,255,.08)!important;
}
.user-avatar svg{width:48px;height:48px;fill:#1595ff;filter:drop-shadow(0 0 8px rgba(21,149,255,.3));}

.title{
  font-size:1.65rem!important;
  margin:0 0 20px!important;
  font-weight:800!important;
  letter-spacing:-.4px!important;
}

.toggle-blur-btn{
  z-index:3;
  display:grid!important;place-items:center!important;
  width:62px!important;height:50px!important;
  border-radius:15px!important;
  background:linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.025))!important;
  border:1px solid rgba(255,255,255,.12)!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 8px 24px rgba(0,0,0,.22)!important;
}

.privacy-icon{
  width:25px;height:25px;
  fill:none;
  stroke:#e8edf5;
  stroke-width:1.7;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.user-info-container{
  position:relative;z-index:1;
  border-radius:20px!important;
  background:rgba(3,7,4,.58)!important;
  border:1px solid rgba(183,255,60,.10)!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.025)!important;
  overflow:hidden;
}

.info-item{
  padding:16px 20px!important;
  border-bottom:1px solid rgba(255,255,255,.07)!important;
}
.info-item:last-child{border-bottom:0!important;}
.info-label{
  display:block!important;
  font-size:.82rem!important;
  font-weight:600!important;
  letter-spacing:.6px!important;
  margin-bottom:5px!important;
}
.info-value{
  font-size:1.05rem!important;
  line-height:1.45!important;
  font-weight:700!important;
}

/* الشريط السفلي: إزالة الأبيض فقط، دون لمس SVG أو الأيقونات */
.custom-nav-bar{
  background:rgba(14,18,15,.88)!important;
  background-color:rgba(14,18,15,.88)!important;
  border:1px solid rgba(183,255,60,.16)!important;
  box-shadow:0 18px 45px rgba(0,0,0,.55),0 0 25px rgba(183,255,60,.035)!important;
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

/* يمنع أي قاعدة خارجية من إعادة اللون الأبيض للخلفية */
.custom-nav-bar,
.custom-nav-bar *{
  -webkit-tap-highlight-color:transparent;
}

@media (max-width:480px){
  .profile-card{padding:20px!important;}
  .user-avatar{width:76px!important;height:76px!important;}
  .user-avatar svg{width:44px;height:44px;}
  .title{font-size:1.5rem!important;margin-bottom:16px!important;}
  .info-item{padding:14px 16px!important;}
}
</style>
</head>
<body class="nav-body">

  <div class="profile-card">
    <button class="toggle-blur-btn" id="toggle-eye" onclick="togglePrivacy()" aria-label="إظهار أو إخفاء البيانات">
  <svg class="privacy-icon" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M2.2 12s3.5-5.5 9.8-5.5 9.8 5.5 9.8 5.5-3.5 5.5-9.8 5.5S2.2 12 2.2 12Z"></path>
    <circle cx="12" cy="12" r="3.2"></circle>
  </svg>
</button>

    <div class="profile-header">
      <div class="user-avatar" aria-label="المستخدم">
  <svg viewBox="0 0 64 64" aria-hidden="true">
    <circle cx="32" cy="20" r="11"></circle>
    <path d="M12 52c1.8-11.2 8.5-17 20-17s18.2 5.8 20 17Z"></path>
  </svg>
</div>
      <h2 class="title">الملف الشخصي</h2>
    </div>

    <div class="user-info-container" id="info-container">
      <div class="info-item">
        <span class="info-label">Name</span>
        <span class="info-value" id="profile-name">جاري التحميل...</span>
      </div>

      <div class="info-item">
        <span class="info-label">G m a i l ★</span>
        <span class="info-value" id="profile-email">جاري التحميل...</span>
      </div>

      <div class="info-item">
        <span class="info-label">PASSWORD ★</span>
        <span class="info-value" id="profile-password">جاري التحميل...</span>
      </div>
    </div>
  </div>

  <!-- شريط التنقل السفلي بالألوان البيضاء والأبعاد المقفلة بدقة -->
  <nav class="custom-nav-bar">
  <div class="nav-buttons-box">

    <a href="page3.html" title="الملف الشخصي" class="nav-item active">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
  <circle cx="12" cy="7" r="4"></circle>
  <path d="M4.2 21c.8-4.3 3.4-6.6 7.8-6.6s7 2.3 7.8 6.6z"></path>
</svg>
    </a>

    <a href="page1.html" title="المنصب" class="nav-item platform-item">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
  <path d="M13.8 2.5 6.7 12h4.7l-1.1 9.5L17.3 11h-4.6z"></path>
</svg>
    </a>

    <a href="page2.html" title="التوظيف" class="nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
  <path d="M4 7.5h16A2 2 0 0 1 22 9.5v9A2 2 0 0 1 20 20.5H4a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2z"></path>
  <path d="M8 7.5V5.8A1.8 1.8 0 0 1 9.8 4h4.4A1.8 1.8 0 0 1 16 5.8v1.7"></path>
  <path d="M2 11.5h20"></path>
  <path d="M10 11.5v2h4v-2"></path>
</svg>
    </a>

  </div>
</nav>

  <script>
    document.getElementById('profile-name').innerText = localStorage.getItem('user_name') || 'مستخدم جديد';
    document.getElementById('profile-email').innerText = localStorage.getItem('user_email') || 'لا يوجد إيميل مسجل';
    document.getElementById('profile-password').innerText = localStorage.getItem('user_password') || '******';

    function togglePrivacy() {
      const container = document.getElementById('info-container');
      const eyeBtn = document.getElementById('toggle-eye');
      container.classList.toggle('blurred-active');
      if (container.classList.contains('blurred-active')) {
        eyeBtn.innerHTML = `<svg class="privacy-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 3l18 18"></path>
            <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
            <path d="M9.2 5.3A10.8 10.8 0 0 1 12 4.9c6.3 0 9.8 7.1 9.8 7.1a17 17 0 0 1-3.1 3.8"></path>
            <path d="M6.1 6.2C3.7 8.2 2.2 12 2.2 12s3.5 7.1 9.8 7.1c1.7 0 3.2-.4 4.5-1"></path>
          </svg>`;
      } else {
        eyeBtn.innerHTML = `<svg class="privacy-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M2.2 12s3.5-5.5 9.8-5.5 9.8 5.5 9.8 5.5-3.5 5.5-9.8 5.5S2.2 12 2.2 12Z"></path>
            <circle cx="12" cy="12" r="3.2"></circle>
          </svg>`;
      }
    }
  </script>

</body>
</html>
