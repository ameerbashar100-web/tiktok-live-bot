<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الملف الشخصي</title>

<link rel="stylesheet" href="style.css">

<style>
/* =========================================================
   PROFILE CARD
   ========================================================= */

.profile-card{
  position:relative;
  width:calc(100% - 40px);
  max-width:620px;
  margin:25px auto 0;
  padding:22px;
  box-sizing:border-box;
  border-radius:26px;
  overflow:hidden;
  isolation:isolate;

  background:
    radial-gradient(
      circle at 15% 5%,
      rgba(150,255,40,.12),
      transparent 32%
    ),
    linear-gradient(
      145deg,
      #111711,
      #090d0a 65%,
      #0d130e
    );

  border:1px solid rgba(180,255,60,.25);

  box-shadow:
    0 20px 55px rgba(0,0,0,.55),
    inset 0 1px 0 rgba(255,255,255,.05);
}

/* لمعة خضراء خفيفة */
.profile-card::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:26px;

  background:
    linear-gradient(
      120deg,
      rgba(190,255,70,.18),
      transparent 30%,
      transparent 70%,
      rgba(120,255,30,.08)
    );

  pointer-events:none;
  z-index:-1;
}


/* =========================================================
   USER AREA
   ========================================================= */

.profile-user{
  display:flex;
  align-items:center;
  gap:15px;
  direction:rtl;
}


/* الصورة */
.avatar-upload{
  position:relative;
  width:76px;
  height:76px;
  flex:0 0 76px;
  cursor:pointer;
}

.avatar-upload img,
.avatar-placeholder{
  width:76px;
  height:76px;

  border-radius:50%;
  object-fit:cover;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    radial-gradient(
      circle,
      #172018,
      #080b09
    );

  border:1px solid rgba(174,255,55,.65);

  box-shadow:
    0 0 0 4px rgba(170,255,50,.05),
    0 0 25px rgba(150,255,40,.20);
}


/* أيقونة المستخدم الافتراضية */
.avatar-placeholder svg{
  width:40px;
  height:40px;
  fill:#baff35;
}


/* علامة الكاميرا الصغيرة */
.avatar-edit{
  position:absolute;
  left:-2px;
  bottom:-2px;

  width:24px;
  height:24px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#b7ff32;
  color:#101510;

  font-size:13px;
  font-weight:bold;

  border:2px solid #090d0a;
}


/* =========================================================
   USER TEXT
   ========================================================= */

.profile-user-info{
  min-width:0;
  flex:1;
}

.profile-name{
  color:#ffffff;
  font-size:1.25rem;
  font-weight:800;
  margin:0 0 6px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.profile-email{
  color:#a8b0aa;
  font-size:.9rem;
  margin:0;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}


/* Available */
.profile-status{
  display:flex;
  align-items:center;
  gap:7px;

  color:#aeb5af;
  font-size:.78rem;

  margin-bottom:16px;
}

.status-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#aaff32;

  box-shadow:
    0 0 8px rgba(170,255,50,.9);
}


/* =========================================================
   BUTTONS
   ========================================================= */

.profile-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;

  margin-top:20px;
}

.profile-action{
  height:48px;

  border-radius:15px;

  border:1px solid rgba(255,255,255,.13);

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.10),
      rgba(255,255,255,.035)
    );

  color:#f4f6f4;

  font-size:.92rem;
  font-weight:700;

  cursor:pointer;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.06),
    0 8px 18px rgba(0,0,0,.18);

  transition:.2s ease;
}

.profile-action:active{
  transform:scale(.97);
}

.profile-action:hover{
  border-color:rgba(180,255,55,.35);
}


/* =========================================================
   MOVING GREEN TICKER
   ========================================================= */

.profile-ticker{
  width:calc(100% - 40px);
  max-width:620px;

  margin:10px auto 0;

  height:48px;

  border-radius:0 0 24px 24px;

  overflow:hidden;

  background:
    linear-gradient(
      90deg,
      #7dff1d,
      #baff3c,
      #79ff18
    );

  color:#071007;

  box-shadow:
    0 12px 30px rgba(120,255,30,.25);

  display:flex;
  align-items:center;
}


/* حركة الشريط */
.ticker-track{
  display:flex;
  width:max-content;

  animation:
    tickerMove 15s linear infinite;
}

.ticker-item{
  display:flex;
  align-items:center;
  gap:9px;

  padding:0 28px;

  white-space:nowrap;

  font-size:.82rem;
  font-weight:800;
}

.ticker-arrow{
  font-size:18px;
  font-weight:900;
}

@keyframes tickerMove{
  from{
    transform:translateX(0);
  }

  to{
    transform:translateX(50%);
  }
}


/* =========================================================
   HIDDEN FILE INPUT
   ========================================================= */

#avatarInput{
  display:none;
}


/* =========================================================
   KEEP BOTTOM NAV
   ========================================================= */

/*
   لا نلمس الأيقونات السفلية.
   سيتم استخدام نفس SVG الموجودة في الملف الحالي.
*/


@media(max-width:480px){

  .profile-card{
    width:calc(100% - 40px);
    margin-top:22px;
    padding:19px;
    border-radius:24px;
  }

  .avatar-upload,
  .avatar-upload img,
  .avatar-placeholder{
    width:72px;
    height:72px;
  }

  .profile-name{
    font-size:1.15rem;
  }

  .profile-email{
    font-size:.82rem;
  }

  .profile-actions{
    gap:8px;
  }

  .profile-action{
    height:46px;
    font-size:.84rem;
  }

  .profile-ticker{
    width:calc(100% - 40px);
  }
}
</style>
</head>


<body class="nav-body">


<!-- =====================================================
     PROFILE CARD
     ===================================================== -->

<div class="profile-card">

  <div class="profile-status">
    <span class="status-dot"></span>
    <span>متاح للعمل</span>
  </div>


  <div class="profile-user">

    <!-- صورة المستخدم -->
    <label class="avatar-upload" for="avatarInput">

      <div
        class="avatar-placeholder"
        id="avatarPlaceholder"
      >

        <svg
          viewBox="0 0 64 64"
          aria-hidden="true"
        >
          <circle
            cx="32"
            cy="20"
            r="11"
          ></circle>

          <path
            d="M12 52c1.8-11.2 8.5-17 20-17s18.2 5.8 20 17Z"
          ></path>
        </svg>

      </div>

      <span class="avatar-edit">✎</span>

    </label>


    <!-- معلومات المستخدم -->
    <div class="profile-user-info">

      <h2
        class="profile-name"
        id="profile-name"
      >
        جاري التحميل...
      </h2>

      <p
        class="profile-email"
        id="profile-email"
      >
        جاري التحميل...
      </p>

    </div>

  </div>


  <!-- أزرار -->
  <div class="profile-actions">

    <button
      type="button"
      class="profile-action"
      onclick="hireUser()"
    >
      ⊕ توظيفي
    </button>

    <button
      type="button"
      class="profile-action"
      onclick="copyEmail()"
    >
      ▣ نسخ Gmail
    </button>

  </div>

</div>


<!-- اختيار الصورة من الهاتف -->
<input
  type="file"
  id="avatarInput"
  accept="image/*"
>


<!-- =====================================================
     GREEN MOVING TICKER
     ===================================================== -->

<div class="profile-ticker">

  <div class="ticker-track">

    <div class="ticker-item">
      <span class="ticker-arrow">↗</span>
      <span>نشاط الحساب مستقر</span>
    </div>

    <div class="ticker-item">
      <span class="ticker-arrow">⚡</span>
      <span>جاهز للفرص الجديدة</span>
    </div>

    <div class="ticker-item">
      <span class="ticker-arrow">↗</span>
      <span>متاح للعمل الآن</span>
    </div>

    <div class="ticker-item">
      <span class="ticker-arrow">◆</span>
      <span>أداء الحساب ممتاز</span>
    </div>

    <!-- تكرار للحركة المستمرة -->
    <div class="ticker-item">
      <span class="ticker-arrow">↗</span>
      <span>نشاط الحساب مستقر</span>
    </div>

    <div class="ticker-item">
      <span class="ticker-arrow">⚡</span>
      <span>جاهز للفرص الجديدة</span>
    </div>

  </div>

</div>



<!-- =====================================================
     BOTTOM NAV
     الأيقونات الثلاثة كما هي
     ===================================================== -->

<nav class="custom-nav-bar">

  <div class="nav-buttons-box">


    <!-- PROFILE -->
    <a
      href="page3.html"
      title="الملف الشخصي"
      class="nav-item active"
    >

      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <circle
          cx="12"
          cy="7"
          r="4"
        ></circle>

        <path
          d="M4.2 21c.8-4.3 3.4-6.6 7.8-6.6s7 2.3 7.8 6.6z"
        ></path>

      </svg>

    </a>


    <!-- MAIN -->
    <a
      href="page1.html"
      title="المنصب"
      class="nav-item platform-item"
    >

      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >

        <path
          d="M13.8 2.5 6.7 12h4.7l-1.1 9.5L17.3 11h-4.6z"
        ></path>

      </svg>

    </a>


    <!-- SHOP -->
    <a
      href="page2.html"
      title="التوظيف"
      class="nav-item"
    >

      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >

        <path
          d="M4 7.5h16A2 2 0 0 1 22 9.5v9A2 2 0 0 1 20 20.5H4a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2z"
        ></path>

        <path
          d="M8 7.5V5.8A1.8 1.8 0 0 1 9.8 4h4.4A1.8 1.8 0 0 1 16 5.8v1.7"
        ></path>

        <path

        <path

      </svg>

  </div>

</nav>



<script>

/* =====================================================
   جلب بيانات المستخدم
   نفس المتغيرات الموجودة في ملفك الحالي
   ===================================================== */

const savedName =
  localStorage.getItem('user_name') || 'مستخدم جديد';

const savedEmail =
  localStorage.getItem('user_email') || 'لا يوجد إيميل مسجل';


document.getElementById('profile-name').innerText =
  savedName;

document.getElementById('profile-email').innerText =
  savedEmail;



/* =====================================================
   صورة المستخدم
   تحفظ الصورة في الجهاز
   ===================================================== */

const avatarInput =
  document.getElementById('avatarInput');

const avatarPlaceholder =
  document.getElementById('avatarPlaceholder');


const savedAvatar =
  localStorage.getItem('profile_avatar');


function showAvatar(src){

  avatarPlaceholder.innerHTML = `
    <img
      src="${src}"
      alt="صورة المستخدم"
    >
  `;

}


if(savedAvatar){
  showAvatar(savedAvatar);
}


avatarInput.addEventListener(
  'change',
  function(){

    const file = this.files[0];

    if(!file){
      return;
    }

    if(!file.type.startsWith('image/')){
      alert('اختر صورة فقط');
      return;
    }

    const reader = new FileReader();

    reader.onload = function(e){

      const imageData =
        e.target.result;

      showAvatar(imageData);

      localStorage.setItem(
        'profile_avatar',
        imageData
      );

    };

    reader.readAsDataURL(file);

  }
);



/* =====================================================
   نسخ Gmail
   ===================================================== */

function copyEmail(){

  const email =
    localStorage.getItem('user_email') || '';

  if(!email){
    return;
  }

  navigator.clipboard
    .writeText(email)
    .then(function(){

      alert('تم نسخ Gmail');

    })
    .catch(function(){

      alert(email);

    });

}



/* =====================================================
   زر التوظيف
   ===================================================== */

function hireUser(){

  alert(
    'يمكنك التواصل مع المستخدم عبر Gmail:\n' +
    savedEmail
  );

}

</script>


</body>
