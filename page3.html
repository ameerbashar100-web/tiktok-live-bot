<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملف الشخصي</title>
    <link rel="stylesheet" href="style.css">

<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800&display=swap');

html,body{
  margin:0;
  min-height:100%;
  background:#050505;
}

body.nav-body{
  min-height:100vh;
  overflow-x:hidden;
  font-family:'Cairo',Arial,sans-serif;
  color:#fff;
}

/* صندوق الملف الشخصي — تصميم احترافي داكن */
.profile-card{
  position:relative;
  overflow:hidden;
  isolation:isolate;
  max-width:620px!important;
  margin:28px auto!important;
  padding:26px!important;
  border-radius:28px!important;
  border:1px solid rgba(255,255,255,.12)!important;
  background:
    radial-gradient(circle at 10% 0%,rgba(0,145,255,.12),transparent 28%),
    linear-gradient(145deg,#151719 0%,#0b0c0d 58%,#070809 100%)!important;
  box-shadow:
    0 28px 70px rgba(0,0,0,.62),
    inset 0 1px 0 rgba(255,255,255,.07)!important;
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

.profile-card::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:28px;
  padding:1px;
  background:linear-gradient(
    135deg,
    rgba(255,255,255,.20),
    transparent 30%,
    transparent 70%,
    rgba(0,145,255,.16)
  );
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  pointer-events:none;
}

.profile-card::after{
  content:"";
  position:absolute;
  width:240px;
  height:240px;
  right:-125px;
  top:-125px;
  border-radius:50%;
  background:rgba(0,145,255,.08);
  filter:blur(45px);
  pointer-events:none;
}

.profile-header{
  position:relative;
  z-index:1;
}

.user-avatar{
  width:84px!important;
  height:84px!important;
  display:grid!important;
  place-items:center!important;
  margin:0 auto 14px!important;
  border-radius:50%!important;
  background:radial-gradient(circle,#101a28,#080c12 72%)!important;
  border:1px solid rgba(0,145,255,.72)!important;
  box-shadow:
    0 0 0 6px rgba(0,145,255,.035),
    0 0 34px rgba(0,145,255,.24),
    inset 0 0 24px rgba(0,145,255,.10)!important;
}

.user-avatar svg{
  width:49px;
  height:49px;
  fill:#1595ff;
  filter:drop-shadow(0 0 8px rgba(21,149,255,.34));
}

.title{
  font-size:1.72rem!important;
  line-height:1.35!important;
  margin:0 0 22px!important;
  font-weight:800!important;
  letter-spacing:-.5px!important;
  text-align:center;
}

.toggle-blur-btn{
  position:relative;
  z-index:3;
  display:grid!important;
  place-items:center!important;
  width:62px!important;
  height:50px!important;
  border-radius:15px!important;
  background:linear-gradient(145deg,rgba(255,255,255,.09),rgba(255,255,255,.025))!important;
  border:1px solid rgba(255,255,255,.13)!important;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.07),
    0 8px 24px rgba(0,0,0,.25)!important;
}

.privacy-icon{
  width:25px;
  height:25px;
  fill:none;
  stroke:#e8edf5;
  stroke-width:1.7;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.user-info-container{
  position:relative;
  z-index:1;
  border-radius:22px!important;
  background:rgba(3,5,7,.72)!important;
  border:1px solid rgba(255,255,255,.10)!important;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.035),
    0 12px 32px rgba(0,0,0,.22)!important;
  overflow:hidden;
}

.info-item{
  padding:19px 22px!important;
  border-bottom:1px solid rgba(255,255,255,.075)!important;
  text-align:right;
}

.info-item:last-child{
  border-bottom:0!important;
}

.info-label{
  display:block!important;
  font-family:'Cairo',Arial,sans-serif;
  font-size:.78rem!important;
  line-height:1.4!important;
  font-weight:700!important;
  letter-spacing:1px!important;
  color:#8e949c!important;
  margin-bottom:7px!important;
  text-transform:none;
}

.info-value{
  display:block!important;
  font-family:'Cairo',Arial,sans-serif;
  font-size:1.12rem!important;
  line-height:1.55!important;
  font-weight:800!important;
  color:#f4f6f8!important;
  overflow-wrap:anywhere;
}

/* إخفاء خانة كلمة المرور فقط، مع إبقاء منطق زر العين كما هو */
.info-item.password-item{
  display:none!important;
}

/* لا يتم تعديل تصميم أو SVG الشريط السفلي */
.custom-nav-bar{
  background:rgba(14,18,15,.88)!important;
  background-color:rgba(14,18,15,.88)!important;
  border:1px solid rgba(183,255,60,.16)!important;
  box-shadow:0 18px 45px rgba(0,0,0,.55),0 0 25px rgba(183,255,60,.035)!important;
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

.custom-nav-bar,
.custom-nav-bar *{
  -webkit-tap-highlight-color:transparent;
}

@media (max-width:480px){
  .profile-card{
    margin:18px 14px!important;
    padding:20px!important;
    border-radius:25px!important;
  }

  .user-avatar{
    width:76px!important;
    height:76px!important;
  }

  .user-avatar svg{
    width:44px;
    height:44px;
  }

  .title{
    font-size:1.5rem!important;
    margin-bottom:18px!important;
  }

  .info-item{
    padding:16px 17px!important;
  }

  .info-value{
    font-size:1.03rem!important;
  }
}
</style>
</head>
<body class="nav-body">

  <div class="profile-card">
    <button class="toggle-blur-btn" id="toggle-eye" onclick="togglePrivacy()" aria-label="إظهار أو إخفاء البيانات">
  <svg class="privacy-icon" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M2.2 12s3.5-5.5 9.8-5.5 9.8 5.5 9.8 5.5-3.5 5.5-9.8 5.5S2.2 12 2.2 12Z"></path>
    <circle cx="12" cy="12" r="3.2"></circle>
  </svg>
</button>

    <div class="profile-header">
      <div class="user-avatar" aria-label="المستخدم">
  <svg viewBox="0 0 64 64" aria-hidden="true">
    <circle cx="32" cy="20" r="11"></circle>
    <path d="M12 52c1.8-11.2 8.5-17 20-17s18.2 5.8 20 17Z"></path>
  </svg>
</div>
      <h2 class="title">الملف الشخصي</h2>
    </div>

    <div class="user-info-container" id="info-container">
      <div class="info-item">
        <span class="info-label">Name</span>
        <span class="info-value" id="profile-name">جاري التحميل...</span>
      </div>

      <div class="info-item">
        <span class="info-label">Gmail</span>
        <span class="info-value" id="profile-email">جاري التحميل...</span>
      </div>
      <div class="info-item password-item">
        <span class="info-label">PASSWORD ★</span>
        <span class="info-value" id="profile-password">جاري التحميل...</span>
      </div>
    </div>
  </div>
<script>
    document.getElementById('profile-name').innerText = localStorage.getItem('user_name') || 'مستخدم جديد';
    document.getElementById('profile-email').innerText = localStorage.getItem('user_email') || 'لا يوجد إيميل مسجل';
    document.getElementById('profile-password').innerText = localStorage.getItem('user_password') || '******';

    function togglePrivacy() {
      const container = document.getElementById('info-container');
      const eyeBtn = document.getElementById('toggle-eye');
      container.classList.toggle('blurred-active');
      if (container.classList.contains('blurred-active')) {
        eyeBtn.innerHTML = `<svg class="privacy-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 3l18 18"></path>
            <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
            <path d="M9.2 5.3A10.8 10.8 0 0 1 12 4.9c6.3 0 9.8 7.1 9.8 7.1a17 17 0 0 1-3.1 3.8"></path>
            <path d="M6.1 6.2C3.7 8.2 2.2 12 2.2 12s3.5 7.1 9.8 7.1c1.7 0 3.2-.4 4.5-1"></path>
          </svg>`;
      } else {
        eyeBtn.innerHTML = `<svg class="privacy-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M2.2 12s3.5-5.5 9.8-5.5 9.8 5.5 9.8 5.5-3.5 5.5-9.8 5.5S2.2 12 2.2 12Z"></path>
            <circle cx="12" cy="12" r="3.2"></circle>
          </svg>`;
      }
    }
  </script>
    <script src="./bottom-nav.js"></script>
</body>
</html>
