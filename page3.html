<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملف الشخصي</title>
    <link rel="stylesheet" href="style.css">

<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&display=swap');

html,body{margin:0;min-height:100%;background:#000;}
body.nav-body{min-height:100vh;overflow-x:hidden;font-family:'Cairo',Arial,sans-serif;color:#fff;}

.profile-card{
  position:relative;overflow:hidden;isolation:isolate;
  width:min(100%,760px)!important;max-width:760px!important;
  min-height:390px;margin:22px auto 28px!important;
  padding:38px 42px!important;box-sizing:border-box;
  border:0!important;border-radius:0!important;background:#000!important;
  box-shadow:none!important;
}
.profile-card::before,.profile-card::after{display:none!important;}
.profile-header{position:relative;z-index:2;display:block;min-height:310px;}

.user-avatar{
  position:absolute!important;left:8px!important;top:0!important;
  width:230px!important;height:230px!important;display:grid!important;
  place-items:center!important;margin:0!important;border-radius:50%!important;
  background:radial-gradient(circle at 50% 45%,#172234 0%,#08101c 52%,transparent 72%)!important;
  border:0!important;box-shadow:none!important;
}
.user-avatar svg{width:145px!important;height:145px!important;fill:#1595ff!important;
  filter:drop-shadow(0 0 16px rgba(21,149,255,.35));}
.title{display:none!important;}

.profile-card .profile-header::before{
  content:"★  ★  ★";position:absolute;left:278px;top:2px;z-index:3;
  color:#fff;font-family:Arial,sans-serif;font-size:28px;font-weight:900;
  letter-spacing:8px;white-space:nowrap;
}
.profile-card .profile-header::after{
  content:"★";position:absolute;left:328px;top:1px;z-index:4;
  color:#168cff;font-family:Arial,sans-serif;font-size:31px;font-weight:900;
}

.toggle-blur-btn{
  position:absolute!important;right:12px!important;top:10px!important;z-index:8;
  display:grid!important;place-items:center!important;width:52px!important;height:45px!important;
  border-radius:13px!important;background:rgba(255,255,255,.07)!important;
  border:1px solid rgba(255,255,255,.12)!important;box-shadow:none!important;
}
.privacy-icon{width:23px;height:23px;fill:none;stroke:#fff;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;}

.user-info-container{
  position:absolute!important;z-index:5;left:278px!important;top:46px!important;
  width:calc(100% - 310px)!important;border:0!important;border-radius:0!important;
  background:transparent!important;box-shadow:none!important;overflow:visible!important;
}
.info-item{padding:0!important;margin:0 0 4px!important;border:0!important;
  text-align:left!important;background:transparent!important;}
.info-item:first-child{margin-bottom:6px!important;}
.info-item:nth-child(2){margin-top:8px!important;}
.info-label{
  display:block!important;font-family:'Cairo',Arial,sans-serif!important;
  font-size:2.15rem!important;line-height:1.12!important;font-weight:900!important;
  letter-spacing:-.8px!important;color:#fff!important;margin:0 0 4px!important;
}
.info-value{
  display:block!important;font-family:'Cairo',Arial,sans-serif!important;
  font-size:1.38rem!important;line-height:1.35!important;font-weight:900!important;
  color:#fff!important;overflow-wrap:anywhere;
}
.info-item:nth-child(2) .info-label{color:#168cff!important;font-size:2.12rem!important;margin-top:8px!important;}
.info-item.password-item{display:none!important;}

.custom-nav-bar{
  background:rgba(14,18,15,.88)!important;background-color:rgba(14,18,15,.88)!important;
  border:1px solid rgba(183,255,60,.16)!important;
  box-shadow:0 18px 45px rgba(0,0,0,.55),0 0 25px rgba(183,255,60,.035)!important;
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
}
.custom-nav-bar,.custom-nav-bar *{-webkit-tap-highlight-color:transparent;}

@media (max-width:600px){
  .profile-card{width:100%!important;min-height:350px;margin:10px auto 20px!important;padding:28px 20px!important;}
  .profile-header{min-height:305px;}
  .user-avatar{left:0!important;top:30px!important;width:145px!important;height:190px!important;}
  .user-avatar svg{width:112px!important;height:112px!important;}
  .profile-card .profile-header::before{left:125px;top:8px;font-size:20px;letter-spacing:5px;}
  .profile-card .profile-header::after{left:177px;top:7px;font-size:23px;}
  .user-info-container{left:145px!important;top:58px!important;width:calc(100% - 150px)!important;}
  .info-label,.info-item:nth-child(2) .info-label{font-size:1.55rem!important;}
  .info-value{font-size:1rem!important;}
  .toggle-blur-btn{right:8px!important;top:4px!important;width:48px!important;height:42px!important;}
}
</style>
</head>
<body class="nav-body">

  <div class="profile-card">
    <button class="toggle-blur-btn" id="toggle-eye" onclick="togglePrivacy()" aria-label="إظهار أو إخفاء البيانات">
  <svg class="privacy-icon" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M2.2 12s3.5-5.5 9.8-5.5 9.8 5.5 9.8 5.5-3.5 5.5-9.8 5.5S2.2 12 2.2 12Z"></path>
    <circle cx="12" cy="12" r="3.2"></circle>
  </svg>
</button>

    <div class="profile-header">
      <div class="user-avatar" aria-label="المستخدم">
  <svg viewBox="0 0 64 64" aria-hidden="true">
    <circle cx="32" cy="20" r="11"></circle>
    <path d="M12 52c1.8-11.2 8.5-17 20-17s18.2 5.8 20 17Z"></path>
  </svg>
</div>
      <h2 class="title">الملف الشخصي</h2>
    </div>

    <div class="user-info-container" id="info-container">
      <div class="info-item">
        <span class="info-label">Name</span>
        <span class="info-value" id="profile-name">جاري التحميل...</span>
      </div>

      <div class="info-item">
        <span class="info-label">Gmail</span>
        <span class="info-value" id="profile-email">جاري التحميل...</span>
      </div>
      <div class="info-item password-item">
        <span class="info-label">PASSWORD ★</span>
        <span class="info-value" id="profile-password">جاري التحميل...</span>
      </div>
    </div>
  </div>
<script>
    document.getElementById('profile-name').innerText = localStorage.getItem('user_name') || 'مستخدم جديد';
    document.getElementById('profile-email').innerText = localStorage.getItem('user_email') || 'لا يوجد إيميل مسجل';
    document.getElementById('profile-password').innerText = localStorage.getItem('user_password') || '******';

    function togglePrivacy() {
      const container = document.getElementById('info-container');
      const eyeBtn = document.getElementById('toggle-eye');
      container.classList.toggle('blurred-active');
      if (container.classList.contains('blurred-active')) {
        eyeBtn.innerHTML = `<svg class="privacy-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 3l18 18"></path>
            <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
            <path d="M9.2 5.3A10.8 10.8 0 0 1 12 4.9c6.3 0 9.8 7.1 9.8 7.1a17 17 0 0 1-3.1 3.8"></path>
            <path d="M6.1 6.2C3.7 8.2 2.2 12 2.2 12s3.5 7.1 9.8 7.1c1.7 0 3.2-.4 4.5-1"></path>
          </svg>`;
      } else {
        eyeBtn.innerHTML = `<svg class="privacy-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M2.2 12s3.5-5.5 9.8-5.5 9.8 5.5 9.8 5.5-3.5 5.5-9.8 5.5S2.2 12 2.2 12Z"></path>
            <circle cx="12" cy="12" r="3.2"></circle>
          </svg>`;
      }
    }
  </script>
    <script src="./bottom-nav.js"></script>
</body>
</html>
