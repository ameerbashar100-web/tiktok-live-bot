<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملف الشخصي</title>
    <link rel="stylesheet" href="style.css">

<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&display=swap');
html,body{margin:0;min-height:100%;background:#000;}
body.nav-body{min-height:100vh;overflow-x:hidden;font-family:'Cairo',Arial,sans-serif;color:#fff;}

.profile-card{
  position:relative;overflow:hidden;isolation:isolate;
  width:min(100%,420px)!important;max-width:420px!important;
  min-height:0;margin:12px auto 20px!important;
  padding:16px 16px 22px!important;box-sizing:border-box;
  border:1px solid rgba(255,255,255,.07)!important;
  border-radius:18px!important;background:#000!important;
  box-shadow:0 10px 30px rgba(0,0,0,.45)!important;
}
.profile-card::before,.profile-card::after{display:none!important;}
.profile-header{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;min-height:0;}

.profile-template{
  width:155px!important;height:112px!important;
  object-fit:cover!important;object-position:center!important;
  display:block!important;margin:0 auto 12px!important;
  border-radius:14px!important;
  border:1px solid rgba(255,255,255,.10)!important;
  box-shadow:0 8px 24px rgba(0,0,0,.5)!important;
}
.title{display:none!important;}

.user-info-container{
  position:relative!important;z-index:5;left:auto!important;top:auto!important;
  width:100%!important;border:0!important;border-radius:14px!important;
  background:rgba(255,255,255,.035)!important;
  box-shadow:none!important;overflow:hidden!important;
  padding:10px 12px!important;box-sizing:border-box!important;
}
.info-item{
  padding:7px 4px!important;margin:0!important;
  border:0!important;border-bottom:1px solid rgba(255,255,255,.07)!important;
  text-align:center!important;background:transparent!important;
}
.info-item:last-child{border-bottom:0!important;}
.info-label{
  display:block!important;font-family:'Cairo',Arial,sans-serif!important;
  font-size:.78rem!important;line-height:1.2!important;font-weight:800!important;
  letter-spacing:0!important;color:#fff!important;margin:0 0 2px!important;
}
.info-value{
  display:block!important;font-family:'Cairo',Arial,sans-serif!important;
  font-size:.98rem!important;line-height:1.4!important;font-weight:800!important;
  color:#fff!important;overflow-wrap:anywhere;
}
.info-item:nth-child(2) .info-label{color:#168cff!important;font-size:.78rem!important;margin-top:0!important;}
.info-item.password-item{display:none!important;}

.toggle-blur-btn{
  position:absolute!important;right:10px!important;top:10px!important;z-index:8;
  display:grid!important;place-items:center!important;width:42px!important;height:38px!important;
  border-radius:10px!important;background:rgba(255,255,255,.07)!important;
  border:1px solid rgba(255,255,255,.10)!important;box-shadow:none!important;
}
.privacy-icon{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;}

@media (max-width:600px){
  .profile-card{width:calc(100% - 24px)!important;min-height:0;margin:8px auto 16px!important;padding:12px 12px 16px!important;}
  .profile-template{width:135px!important;height:98px!important;margin-bottom:10px!important;}
  .user-info-container{width:100%!important;}
  .info-label{font-size:.72rem!important;}
  .info-value{font-size:.9rem!important;}
  .toggle-blur-btn{right:7px!important;top:7px!important;width:38px!important;height:34px!important;}
}
</style>
</head>
