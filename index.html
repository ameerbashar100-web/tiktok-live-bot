<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الحسابات</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. واجهة تسجيل الدخول (Sign In) -->
    <div id="signInContainer" class="form-container">
        <form class="form" id="signInForm" onsubmit="handleSignIn(event)">
            <h2 style="text-align: center; color: #151717; margin-bottom: 10px;">تسجيل الدخول</h2>
            
            <div class="flex-column">
                <label>البريد الإلكتروني</label>
                <div class="inputForm">
                    <input type="email" id="loginEmail" class="input" placeholder="Enter your Email" required>
                </div>
            </div>
            
            <div class="flex-column">
                <label>كلمة المرور</label>
                <div class="inputForm">
                    <input type="password" id="loginPassword" class="input" placeholder="Enter your Password" required>
                </div>
            </div>
            
            <button type="submit" class="button-submit">Sign In</button>
            <p class="p">Don't have an account? <span class="span" onclick="toggleForms()">Sign Up</span></p>
        </form>
    </div>

    <!-- 2. واجهة إنشاء الحساب الجديد (Sign Up) -->
    <div id="signUpContainer" class="form-container" style="display: none;">
        <form class="form" id="signUpForm" onsubmit="handleSignUp(event)">
            <h2 style="text-align: center; color: #151717; margin-bottom: 10px;">إنشاء حساب جديد</h2>
            
            <div class="flex-column">
                <label>البريد الإلكتروني</label>
                <div class="inputForm">
                    <input type="email" id="regEmail" class="input" placeholder="Enter your Email" required>
                </div>
            </div>
            
            <div class="flex-column">
                <label>كلمة المرور</label>
                <div class="inputForm">
                    <input type="password" id="regPassword" class="input" placeholder="Enter your Password" required>
                </div>
            </div>

            <div class="flex-column">
                <label>رمز الدعوة (Invitation Code)</label>
                <div class="inputForm">
                    <input type="text" id="inviteCode" class="input" placeholder="Enter Code" required>
                </div>
            </div>
            
            <button type="submit" class="button-submit">Sign Up</button>
            <p class="p">Already have an account? <span class="span" onclick="toggleForms()">Sign In</span></p>
        </form>
    </div>

    <!-- رسائل التنبيه والخطأ الذكية لتختفي بثانية واحدة -->
    <div id="toastNotification" class="toast"></div>

    <!-- تفعيل البرمجة والذكاء الذاتي للموقع -->
    <script src="script.js"></script>
</body>
</html>
