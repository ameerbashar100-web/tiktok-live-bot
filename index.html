<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ACCE — تسجيل المستخدم</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

<style>
:root{
--bg:#eef6fb;
--card:#fff;
--accent:#0b63c5;
--green:#16a34a;
--muted:#6b7280;
}
*{box-sizing:border-box}
body{
margin:0;
font-family:'Cairo',sans-serif;
background:linear-gradient(180deg,#f4f8fb,#eef6fb);
}
.page{
min-height:100vh;
display:flex;
justify-content:center;
padding:28px;
}
.panel{
width:420px;
max-width:96%;
}
.logo{
font-size:42px;
font-weight:900;
color:#3b6fbf;
text-align:center;
margin-bottom:20px;
}
.card{
background:#fff;
padding:20px;
border-radius:16px;
box-shadow:0 10px 30px rgba(0,0,0,.08);
}
.field{
margin-bottom:15px;
}
label{
display:block;
font-weight:bold;
margin-bottom:8px;
}
.input{
width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:10px;
font-size:15px;
}
.captcha{
display:flex;
gap:10px;
align-items:center;
}
.captcha .text{
background:#f4f4ff;
padding:10px;
border-radius:8px;
font-weight:bold;
color:#7c3aed;
}
.invite{
display:flex;
gap:10px;
align-items:center;
}
.invite input{
flex:1;
padding:12px;
border:1px solid #ddd;
border-radius:10px;
}
#inviteClear{
cursor:pointer;
}
.message{
display:none;
padding:12px;
background:#ffecec;
color:#b91c1c;
border-radius:8px;
margin-top:10px;
font-weight:bold;
}
.bottom-links{
display:flex;
justify-content:center;
gap:15px;
margin-top:20px;
}
.link{
text-decoration:none;
color:#0b63c5;
font-weight:bold;
}
.overlay{
display:none;
position:fixed;
inset:0;
background:rgba(255,255,255,.7);
justify-content:center;
align-items:center;
}
.loader-box{
width:260px;
height:170px;
background:#fff;
border-radius:12px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
}
.spinner{
width:60px;
height:60px;
border:6px solid #ddd;
border-top-color:#0b63c5;
border-radius:50%;
animation:spin 1s linear infinite;
}
@keyframes spin{
to{transform:rotate(360deg)}
}
.check{
display:none;
font-size:45px;
color:#16a34a;
}
</style>
</head>

<body>

<div class="page">
<div class="panel">

<div class="logo">ACCE</div>

<div class="card">
  <div class="field">
<label>GMAIL ✦ هاتف</label>
<input class="input" id="phone" placeholder="07xxxxxxxx">
</div>

<div class="field">
<label>كلمة المرور</label>
<input class="input" type="password" id="pass" placeholder="Password">
</div>

<div class="field">
<label>تأكيد كلمة المرور</label>
<input class="input" type="password" id="pass2" placeholder="Confirm Password">
</div>

<div class="field">
<label>الكابتشا</label>
<div class="captcha">
<div class="text" id="captchaText">hyv6</div>
<input class="input" id="captchaInput">
</div>
</div>

<div class="field">
<label>رمز الدعوة</label>
<div class="invite">
<input id="inviteInput" maxlength="5">
<div id="inviteClear">✖</div>
</div>
</div>

<div class="field">
<input type="checkbox" id="agree">
<label for="agree">لقد قرأت وأوافق على اتفاقية التسجيل</label>
</div>

<div id="msg" class="message"></div>

<div class="bottom-links">
<a href="#" id="createLink" class="link">إنشاء حساب</a>
<span>·</span>
<a href="#" id="loginLink" class="link">تسجيل دخول</a>
</div>

</div>
</div>
</div>

<div class="overlay" id="overlay">
<div class="loader-box">
<div class="spinner" id="spinner"></div>
<div class="check" id="check">✓</div>
</div>
</div>

<script>
function rand5(){
const letters="abcdefghijklmnopqrstuvwxyz";
let s="";
for(let i=0;i<5;i++){
s+=letters[Math.floor(Math.random()*letters.length)];
}
return s;
}

inviteInput.value=rand5();

inviteClear.onclick=function(){
inviteInput.value="";
};

function showMsg(t){
msg.innerText=t;
msg.style.display="block";
}

function showLoader(){
overlay.style.display="flex";
setTimeout(()=>{
spinner.style.display="none";
check.style.display="block";
},1200);

setTimeout(()=>{
location.href="pages/home.html";
},2000);
}

createLink.onclick=function(e){
e.preventDefault();
  const phone = phoneInput.value.trim();
const pass = document.getElementById("pass").value;
const pass2 = document.getElementById("pass2").value;
const captcha = captchaInput.value.trim();
const invite = inviteInput.value.trim();
const agree = document.getElementById("agree").checked;

msg.style.display = "none";

if(phone===""){
    showMsg("الرجاء إدخال رقم الهاتف");
    return;
}

if(pass===""){
    showMsg("الرجاء إدخال كلمة المرور");
    return;
}

if(pass!==pass2){
    showMsg("كلمتا المرور غير متطابقتين");
    return;
}

if(captcha!==captchaText.textContent){
    showMsg("كود الكابتشا غير صحيح");
    return;
}

if(invite.length!==5){
    showMsg("رمز الدعوة يجب أن يكون 5 أحرف");
    return;
}

if(!agree){
    showMsg("يجب الموافقة على اتفاقية التسجيل");
    return;
}

localStorage.setItem("acce_user",phone);

showLoader();
};

loginLink.onclick=function(e){
e.preventDefault();
showMsg("عذراً، ليس لديك حساب مسبقاً.");
};
</script>

</body>
</html>
