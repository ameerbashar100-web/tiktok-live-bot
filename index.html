<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Messages</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>Messages</h1>
      <button class="add-btn" aria-label="Add">+</button>
    </header>

    <div class="search-box">
      <span class="search-icon"></span>
      <input id="search" type="search" placeholder="Search" autocomplete="off">
    </div>

    <nav class="tabs">
      <button class="tab active">All <b>4</b></button>
      <button class="tab">Unread <b>4</b></button>
      <button class="tab plus-tab">+</button>
    </nav>

    <section id="groups" class="groups"></section>

    <footer class="bottom-nav">
      <button class="bottom-item active" aria-label="Messages">
        <span class="chat-icon"><i></i><i></i><i></i></span>
        <span class="bottom-badge">1.2K</span>
      </button>
      <button class="bottom-item" aria-label="Contacts">
        <span class="contacts-icon"></span>
      </button>
      <button class="bottom-item" aria-label="Profile">
        <span class="profile-icon"></span>
      </button>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
