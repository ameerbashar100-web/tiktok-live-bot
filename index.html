<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1, viewport-fit=cover" />
  <title>GAT — الصفحة الرئيسية</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="full-black">
  <main class="center">
    <!-- perf-card (الصفحة الرئيسية) -->
    <div class="perf-container">
      <div class="perf-glow" aria-hidden="true"></div>

      <div class="perf-card" role="region" aria-label="بطاقة الأداء" tabindex="0">
        <div class="perf-left">
          <div class="perf-icon-wrap" aria-hidden="true">
            <svg class="perf-icon" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
              <rect x="1.5" y="1.5" width="21" height="21" rx="5" fill="none" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>
              <path d="M4 16l5-6 3 3 7-7" stroke="#27E1B1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            </svg>
          </div>

          <div class="perf-info">
            <div class="perf-number">00.0</div>
            <div class="perf-sub">Performance</div>
          </div>
        </div>

        <div class="perf-middle">
          <div class="bars">
            <div class="bar"><span></span></div>
            <div class="bar"><span></span></div>
          </div>
          <div class="labels"><div>CPU</div><div>MEM</div></div>
        </div>

        <div class="perf-right">
          <div class="online-dot" aria-hidden="true"></div>
          <div class="online-text">ONLINE</div>
        </div>
      </div>
    </div>

    <nav style="display:flex;gap:12px;justify-content:center;margin-top:18px">
      <a href="packages.html" class="link">الباقات</a>
      <a href="profile.html" class="link">ملفي</a>
      <a href="auth.html" class="link">تسجيل الدخول</a>
    </nav>
  </main>

  <script>
    (function(){
      const perf = document.querySelector('.perf-card');
      if(perf){
        perf.addEventListener('click', ()=>{
          perf.classList.toggle('active');
          const spans = perf.querySelectorAll('.bar span');
          spans.forEach(s=> s.style.transform = perf.classList.contains('active') ? 'translateY(0%) scaleY(1)' : 'translateY(10%) scaleY(0.9)');
        });
      }
    })();
  </script>
</body>
</html>
