<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول الذهبي</title>
    <style>
        /* التنسيق الأساسي لوسط الشاشة والخلفية الداكنة */
        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            box-sizing: border-box;
        }

        /* كود الـ CSS الذهبي الذي أرسلته من Uiverse.io */ 
        .gold-form-container {
          display: flex;
          justify-content: center;
          align-items: center;
        }

        .gold-form {
          width: 285px;
          height: auto;
          padding: 25px;
          background: linear-gradient(135deg, #ffd700, #daa520, #b8860b);
          border-radius: 20px;
          box-shadow:
            10px 10px 20px rgba(139, 90, 43, 0.6),
            -10px -10px 20px rgba(204, 173, 2, 0.126),
            inset 2px 2px 5px rgba(237, 201, 0, 0.5),
            inset -2px -2px 5px rgba(139, 90, 43, 0.5);
          background-image: radial-gradient(
              circle,
              rgba(255, 215, 0, 0.25) 1px,
              transparent 1px
            ),
            radial-gradient(circle, rgba(255, 193, 7, 0.15) 1px, transparent 1px);
          background-size: 20px 20px;
          background-position:
            0 0,
            10px 10px;
        }

        .gold-form-group {
          position: relative;
          margin-bottom: 14px;
          text-align: right;
        }

        .gold-form-label {
          display: block;
          color: #3d2f1a; /* تعديل لون النص ليكون واضحاً على الخلفية الذهبية */
          font-size: 14px;
          font-weight: 600;
          margin-bottom: 8px;
          text-transform: uppercase;
          letter-spacing: 0.5px;
          transition: color 0.3s cubic-bezier(0.5, 0, 0.1, 1);
        }

        .gold-form-input {
          width: 100%;
          padding: 14px 16px;
          border: none;
          background: linear-gradient(135deg, #daa520, #b8860b);
          border-radius: 12px;
          font-weight: bold;
          box-shadow:
            6px 6px 12px rgba(139, 90, 43, 0.6),
            -6px -6px 12px rgba(255, 215, 0, 0.4),
            inset 2px 2px 4px rgba(139, 90, 43, 0.5),
            inset -2px -2px 4px rgba(255, 215, 0, 0.5);
          font-size: 16px;
          color: #ffffff;
          transition:
            box-shadow 0.4s cubic-bezier(0.5, 0, 0.1, 1),
            background 0.4s cubic-bezier(0.5, 0, 0.1, 1),
            border-color 0.4s cubic-bezier(0.5, 0, 0.1, 1);
          box-sizing: border-box;
        }

        .gold-form-input:focus {
          outline: none;
          background: linear-gradient(135deg, #daa520, #b8860b);
          border-color: #ffcc00;
          box-shadow:
            4px 4px 8px rgba(139, 90, 43, 0.7),
            -4px -4px 8px rgba(255, 215, 0, 0.5),
            inset 4px 4px 8px rgba(139, 90, 43, 0.6),
            inset -4px -4px 8px rgba(255, 215, 0, 0.6);
        }

        .gold-form-button {
          width: 100%;
          padding: 14px;
          background: linear-gradient(135deg, #f0cd07, #ffc32d, #f5ba26);
          border: 0px solid rgba(255, 217, 0, 0);
          border-radius: 12px;
          color: #3d2f1a;
          font-size: 16px;
          font-weight: bold;
          letter-spacing: 0.8px;
          margin-top: 14px;
          text-transform: uppercase;
          cursor: pointer;
          box-shadow:
            10px 10px 20px rgba(139, 90, 43, 0.6),
            -10px -10px 20px rgba(255, 215, 0, 0.4),
            inset 2px 2px 5px rgba(255, 215, 0, 0.5),
            inset -2px -2px 5px rgba(139, 90, 43, 0.5);
          transition:
            transform 0.3s cubic-bezier(0.5, 0, 0.1, 1),
            box-shadow 0.3s cubic-bezier(0.5, 0, 0.1, 1),
            background 0.4s cubic-bezier(0.5, 0, 0.1, 1);
        }

        .gold-form-button:hover {
          transform: translateY(-2px);
        }

        .gold-form-button:active {
          transform: translateY(1px);
        }
        
        .gold-links {
            margin-top: 15px;
            font-size: 13px;
            text-align: center;
        }
        .gold-links a {
            color: #3d2f1a;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="gold-form-container">
        <form class="gold-form">
            <h2 style="color: #3d2f1a; font-size: 22px; text-align: center; margin-bottom: 20px;">تسجيل الدخول</h2>
            
            <div class="gold-form-group">
                <label class="gold-form-label">اسم المستخدم</label>
                <input type="text" class="gold-form-input" placeholder="أدخل اسم المستخدم" required>
            </div>
            
            <div class="gold-form-group">
                <label class="gold-form-label">كلمة المرور</label>
                <input type="password" class="gold-form-input" placeholder="أدخل كلمة المرور" required>
            </div>
            
            <button type="submit" class="gold-form-button">دخول</button>
            
            <div class="gold-links">
                <a href="#">نسيت كلمة المرور؟</a>
            </div>
        </form>
    </div>

</body>
</html>
