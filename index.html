<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ACCE — تسجيل المستخدم</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#eef6fb;--card:#ffffff;--muted:#6b7280;--accent:#0b63c5;--green:#16a34a}
    *{box-sizing:border-box}
    body{margin:0;font-family:'Cairo',sans-serif;background:linear-gradient(180deg,#f4f8fb,#eef6fb);color:#07102a}
    .page{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:28px}
    .panel{width:420px;max-width:96%;}

    .topbar{display:flex;align-items:center;gap:12px;margin-bottom:6px}
    .logo{font-size:42px;font-weight:900;color:#3b6fbf;letter-spacing:2px}
    .icons{margin-left:auto;display:flex;gap:10px;align-items:center}
    .flag{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff;box-shadow:0 6px 18px rgba(11,32,64,0.06)}
    .clock{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:transparent;color:#374151}

    .title{font-size:34px;text-align:center;font-weight:800;margin:6px 0 12px}

    .card{background:linear-gradient(180deg,#ffffff,#f7fbff);border-radius:16px;padding:18px;box-shadow:0 12px 40px rgba(2,6,23,0.06);border:1px solid rgba(11,32,64,0.03)}
    .field{margin-bottom:16px}
    label{display:block;font-weight:700;color:#0b3a66;margin-bottom:8px}
    .input{width:100%;padding:14px;border-radius:10px;border:1px solid rgba(10,20,40,0.06);background:rgba(250,252,255,0.9);font-size:15px;color:#2b3e50}

    .phone-row{display:flex;gap:10px;align-items:flex-start;flex-direction:column}
    .codeFull{width:100%;padding:12px;border-radius:10px;border:1px solid rgba(10,20,40,0.06);background:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}

    .captcha{display:flex;align-items:center;gap:8px;padding:8px;border-radius:10px;background:#fff;border:1px solid rgba(10,20,40,0.04)}
    .captcha .text{font-weight:800;color:#8b5cf6;padding:8px 12px;border-radius:8px;background:linear-gradient(90deg,#fff,#f3f6ff)}
    .captcha input{flex:1;padding:10px;border-radius:8px;border:1px solid rgba(10,20,40,0.04)}

    .invite{display:flex;align-items:center;gap:8px}
    .invite input{width:100%;padding:12px;border-radius:10px;border:1px solid rgba(10,20,40,0.06);font-weight:800;letter-spacing:2px;text-transform:lowercase}

    .checkbox{display:flex;align-items:center;gap:8px;margin-top:6px}

    .bottom-links{display:flex;justify-content:center;gap:12px;margin-top:14px}
    .link{color:#2b63b8;font-weight:700;text-decoration:none;font-size:18px}

    .message{display:none;padding:12px;border-radius:8px;margin-top:10px;background:#ffecec;color:#8a0b0b;font-weight:700}

    /* loading overlay */
    .overlay{position:fixed;inset:0;background:rgba(255,255,255,0.6);display:flex;align-items:center;justify-content:center;z-index:1200;backdrop-filter:blur(4px)}
    .loader-box{width:260px;height:160px;border-radius:12px;background:linear-gradient(180deg,#fff,#f3f8ff);box-shadow:0 12px 40px rgba(2,6,23,0.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
    .spinner{width:64px;height:64px;border-radius:50%;border:6px solid rgba(11,99,197,0.14);border-top-color:var(--accent);animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .check{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:36px;color:#fff;background:var(--green);opacity:0;transform:scale(0.6);transition:all .35s ease}
    .check.show{opacity:1;transform:scale(1)}

    /* home page */
    .home{padding:18px;font-family:'Cairo',sans-serif}
    .user-card{display:flex;align-items:center;gap:12px;background:#fff;padding:12px;border-radius:12px;box-shadow:0 8px 24px rgba(2,6,23,0.06)}
    .avatar{width:56px;height:56px;border-radius:50%;background:linear-gradient(180deg,#fff,#f0f6ff);display:flex;align-items:center;justify-content:center;font-size:26px}
    .user-info{display:flex;flex-direction:column}
    .user-name{font-weight:800;font-size:18px}
    .user-sub{color:var(--muted);font-size:13px}

    .nav-bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;width:420px;max-width:96%;background:linear-gradient(180deg,#0b1220,#243246);color:#fff;border-radius:14px;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:6px;box-shadow:0 12px 40px rgba(2,6,23,0.28)}
    .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px}
    .nav-item svg{width:28px;height:28px;opacity:0.95;filter:drop-shadow(0 2px 8px rgba(0,0,0,0.25))}
    .nav-item .label{font-size:12px}

    .active-center{background:linear-gradient(90deg,#2b82f6,#0b63c5);width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-top:-24px;box-shadow:0 8px 30px rgba(11,99,197,0.28)}

    @media (max-width:440px){.nav-bottom{width:94%}}
  </style>
</head>
<body>
  <div class="page" id="page">
    <div class="panel">
      <div class="topbar">
        <div class="logo">ACCE</div>
        <div class="icons">
          <div class="flag" id="topFlag">🇦🇺</div>
          <div class="clock">⏲️</div>
        </div>
      </div>

      <div class="title">تسجيل المستخدم</div>

      <div class="card" role="main" aria-label="نموذج التسجيل">

        <div class="field">
          <label>G M A I L ✦ هاتــــــف</label>
          <div class="phone-row">
            <div class="codeFull" id="countryBox">🇦🇺</div>
            <input class="input" id="phone" placeholder="07xxxxxxxx" aria-label="رقم الهاتف">
          </div>
        </div>

        <div class="field">
          <label>كلمة المرور</label>
          <input class="input" id="pass" type="password" placeholder="Password">
        </div>

        <div class="field">
          <label>تأكيد كلمة المرور</label>
          <input class="input" id="pass2" type="password" placeholder="Confirm Password">
        </div>

        <div class="field">
          <label>الكابتشا الرسومية</label>
          <div class="captcha">
            <div class="text" id="captchaText">hyv6</div>
            <input id="captchaInput" placeholder="" aria-label="كابتشا" />
          </div>
        </div>

        <div class="field">
          <label>رمز الدعوة</label>
          <div class="invite">
            <input id="inviteInput" maxlength="5" value="" aria-label="رمز الدعوة" />
            <div style="opacity:0.6;cursor:pointer" id="inviteClear">✖</div>
          </div>
        </div>

        <div class="checkbox">
          <input type="checkbox" id="agree"><label for="agree">لقد قرأت وأوافق على اتفاقية التسجيل</label>
        </div>

        <div class="message" id="msg">عذراً، ليس لديك حساب مسبقاً.</div>

        <div class="bottom-links">
          <a class="link" href="#" id="createLink">إنشاء حساب</a>
          <span style="color:#9aa7c9">·</span>
          <a class="link" href="#" id="loginLink">تسجيل دخول</a>
        </div>

      </div>

      <footer></footer>
    </div>
  </div>

  <!-- loading overlay (hidden by default) -->
  <div class="overlay" id="overlay" style="display:none">
    <div class="loader-box">
      <div class="spinner" id="spinner"></div>
      <div style="font-weight:800;color:#0b3a66">جارٍ إنشاء الحساب...</div>
      <div class="check" id="check">✓</div>
    </div>
  </div>

  <script>
    // utilities
    function rand5(){const letters='abcdefghijklmnopqrstuvwxyz';let s='';for(let i=0;i<5;i++) s+=letters[Math.floor(Math.random()*letters.length)];return s;}

    const countryBox = document.getElementById('countryBox');
    const topFlag = document.getElementById('topFlag');
    const phoneInput = document.getElementById('phone');
    const msg = document.getElementById('msg');
    const captchaText = document.getElementById('captchaText');
    const captchaInput = document.getElementById('captchaInput');
    const inviteInput = document.getElementById('inviteInput');
    const inviteClear = document.getElementById('inviteClear');

    // defaults
    countryBox.textContent = '🇦🇺'; topFlag.textContent = '🇦🇺'; inviteInput.value = rand5();

    inviteClear.addEventListener('click', ()=>{inviteInput.value=''; inviteInput.focus();});
    inviteInput.addEventListener('input', function(){ this.value=this.value.replace(/[^a-zA-Z]/g,'').toLowerCase().slice(0,5); });

    phoneInput.addEventListener('input', function(){ const v=this.value.replace(/\D/g,''); if(v.startsWith('077')){ countryBox.textContent='🇮🇶'; topFlag.textContent='🇮🇶'; } else { countryBox.textContent='🇦🇺'; topFlag.textContent='🇦🇺'; } });

    // show overlay loader then success then go to homepage
    function showLoaderThenHome(userLabel){
      const overlay = document.getElementById('overlay');
      const spinner = document.getElementById('spinner');
      const check = document.getElementById('check');
      overlay.style.display='flex';
      // start with spinner visible
      spinner.style.display='block'; check.classList.remove('show');
      // simulate progress: 1.2s spinner (blue), then show green check and go
      setTimeout(()=>{
        // hide spinner, show check
        spinner.style.display='none'; check.classList.add('show');
      },1200);
      setTimeout(()=>{
        overlay.style.display='none';
        renderHome(userLabel);
      },2000);
    }

    // render homepage with nav and user info
    function renderHome(userLabel){
      // store current user to localStorage
      localStorage.setItem('acce_user', userLabel);
      document.body.innerHTML = `
        <div class="home">
          <div style="max-width:960px;margin:18px auto;padding:18px">
            <div class="user-card">
              <div class="avatar">👤</div>
              <div class="user-info">
                <div class="user-name">${escapeHtml(userLabel)}</div>
                <div class="user-sub">مرحباً بك في ACCE</div>
              </div>
            </div>
            <div style="margin-top:18px;font-weight:700;color:#0b3a66">لوحة التحكم</div>
          </div>

          <nav class="nav-bottom" role="navigation">
            <div class="nav-item"><svg viewBox="0 0 24 24" fill="none"><path d="M3 11.5L12 4l9 7.5" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="label">الرئيسية</div></div>
            <div class="nav-item"><svg viewBox="0 0 24 24" fill="none"><path d="M4 4h16v6H4zM4 14h10v6H4z" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="label">التوظيف</div></div>
            <div class="nav-item" style="text-align:center;"><div class="active-center"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2v20" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="label">المنصب</div></div>
            <div class="nav-item"><svg viewBox="0 0 24 24" fill="none"><path d="M3 7h18M3 12h18M3 17h18" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="label">السجل</div></div>
            <div class="nav-item"><svg viewBox="0 0 24 24" fill="none"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zM3 20a9 9 0 0 1 18 0" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="label">المركز الشخصي</div></div>
          </nav>
        </div>
      `;
    }

    function escapeHtml(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c]; }); }

    // on load, if user exists in localStorage, go to home directly
    window.addEventListener('DOMContentLoaded', ()=>{
      const u = localStorage.getItem('acce_user');
      if(u){ renderHome(u); }
    });

    // login behavior
    document.getElementById('loginLink').addEventListener('click', function(e){ e.preventDefault(); msg.textContent='عذراً، ليس لديك حساب مسبقاً.'; msg.style.display='block'; msg.scrollIntoView({block:'center',behavior:'smooth'}); });

    // create behavior: validations then loader then home
    document.getElementById('createLink').addEventListener('click', function(e){
      e.preventDefault();
      const phone = phoneInput.value.trim();
      const p1 = document.getElementById('pass').value;
      const p2 = document.getElementById('pass2').value;
      const agree = document.getElementById('agree').checked;
      const inviteVal = inviteInput.value.trim();
      msg.style.display='none';
      if(!phone || !p1 || !p2){ msg.textContent='الرجاء تعبئة كل الحقول.'; msg.style.display='block'; return; }
      if(p1 !== p2){ msg.textContent='كلمتا المرور غير متطابقتين.'; msg.style.display='block'; return; }
      if(!agree){ msg.textContent='يجب الموافقة على اتفاقية التسجيل.'; msg.style.display='block'; return; }
      if((captchaInput.value || '').trim() !== captchaText.textContent.trim()){ msg.textContent='كود الكابتشا غير مطابق.'; msg.style.display='block'; return; }
      if(inviteVal.length !== 5){ msg.textContent='رمز الدعوة يجب أن يكون 5 أحرف إنجليزية.'; msg.style.display='block'; return; }

      // show loader then home; use phone/email as label
      const userLabel = phone || inviteVal;
      document.getElementById('overlay').style.display='flex';
      setTimeout(()=>{ showLoaderThenHome(userLabel); }, 100);
    });

  </script>
</body>
</html>
