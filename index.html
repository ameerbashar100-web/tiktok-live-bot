<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Messages — BonChat</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="phone">
  <header class="topbar">
    <h1>Messages</h1>
    <button class="icon-btn add" aria-label="New message">+</button>
  </header>

  <div class="search"><span>⌕</span><input aria-label="Search" placeholder="Search"></div>

  <div class="filters">
    <button class="filter active">All <b>4</b></button>
    <button class="filter">Unread <b>4</b></button>
    <button class="filter plus">+</button>
  </div>

  <section class="messages" id="messages">
    <button class="row">
      <div class="avatar fav">▣</div>
      <div class="row-main"><div class="title">My Favorites</div><div class="preview">Sigue siendo un placer de ser parte de esta organ...</div></div>
      <div class="time">10/13</div>
    </button>
    <button class="row">
      <div class="avatar teal">▣</div>
      <div class="row-main"><div class="title">Server Operator:tp666888</div><div class="preview">Feedback and Suggestions</div></div>
      <div class="time">09:43</div>
      <div class="pin">▮</div>
    </button>
    <button class="row">
      <div class="avatar crypto">USA2</div><span class="badge big">1.2K</span>
      <div class="row-main"><div class="title">USA2 Oak Crypto (California) Signal Trading</div><div class="preview red"><b>[Arthur Brooks（California） pinned message]</b> Susan: ¡B...</div></div>
      <div class="time">09:43</div>
    </button>
    <button class="row">
      <div class="avatar mary">◆</div><span class="badge">9</span>
      <div class="row-main"><div class="title">Grupo Marycarmen</div><div class="preview red"><b>[NinaUSA2（California） pinned message]</b> Cecy:Gracias...</div></div>
      <div class="time">09:18</div>
    </button>
    <button class="row">
      <div class="avatar oak">◈</div><span class="badge">29</span>
      <div class="row-main"><div class="title">Oak Crypto's Growth Trajectory - Group</div><div class="preview red"><b>[NinaPeru pinned message]</b> NinaUSA（Texas）: Se...</div></div>
      <div class="time">Wednesday</div>
    </button>
    <button class="row">
      <div class="avatar qmc">◎</div><span class="badge small">1</span>
      <div class="row-main"><div class="title">Arthur Brooks （California）</div><div class="preview">¿Qué planes tienes hoy? ¿Con qué amigos c...</div></div>
      <div class="time">Wednesday</div>
    </button>
    <button class="row">
      <div class="avatar nina">✦</div>
      <div class="row-main"><div class="title">NinaUSA （California）</div><div class="preview">Perfecto! Muchísimas gracias Nina así lo haré</div></div>
      <div class="time">11/18</div>
    </button>
  </section>

  <nav class="bottom">
    <button class="tab active"><span class="chat-icon">•••</span><span class="count">1.2K</span></button>
    <button class="tab"><span class="contacts-icon">▧</span></button>
    <button class="tab"><span class="profile-icon"></span></button>
  </nav>
</main>
<script src="app.js"></script>
</body>
</html>
