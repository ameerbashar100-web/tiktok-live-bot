<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>بوابة الحسابات والاستثمار</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. واجهة تسجيل الدخول والإنشاء (قبل الدخول) -->
    <div id="authContainer" class="auth-wrapper">
        <div id="signInContainer" class="form-card-auth">
            <form class="form" onsubmit="handleSignIn(event)">
                <h2 class="auth-title">تسجيل الدخول</h2>
                <div class="flex-column">
                    <label>البريد الإلكتروني</label>
                    <div class="inputForm"><input type="email" id="loginEmail" class="input" placeholder="Enter your Email" required></div>
                </div>
                <div class="flex-column">
                    <label>كلمة المرور</label>
                    <div class="inputForm"><input type="password" id="loginPassword" class="input" placeholder="Enter your Password" required></div>
                </div>
                <button type="submit" class="button-submit">Sign In</button>
                <p class="p">Don't have an account? <span class="span" onclick="toggleForms()">Sign Up</span></p>
            </form>
        </div>

        <div id="signUpContainer" class="form-card-auth" style="display: none;">
            <form class="form" onsubmit="handleSignUp(event)">
                <h2 class="auth-title">إنشاء حساب جديد</h2>
                <div class="flex-column">
                    <label>البريد الإلكتروني</label>
                    <div class="inputForm"><input type="email" id="regEmail" class="input" placeholder="Enter your Email" required></div>
                </div>
                <div class="flex-column">
                    <label>كلمة المرور</label>
                    <div class="inputForm"><input type="password" id="regPassword" class="input" placeholder="Enter your Password" required></div>
                </div>
                <div class="flex-column">
                    <label>رمز الدعوة (Invitation Code)</label>
                    <div class="inputForm"><input type="text" id="inviteCode" class="input" placeholder="Enter Code" required></div>
                </div>
                <button type="submit" class="button-submit">Sign Up</button>
                <p class="p">Already have an account? <span class="span" onclick="toggleForms()">Sign In</span></p>
            </form>
        </div>
    </div>

    <!-- 2. الشاشة الرئيسية الكلية للموقع -->
    <div id="mainAppContainer" class="app-wrapper" style="display: none;">
        <div class="app-content">
            
            <!-- الصفحة الأولى: صفحة العداد الإحصائي المالي -->
            <div id="page1" class="page-view">
                <div class="stat-card">
                    <div class="stat-title">
                        <span class="stat-icon">
                            <svg width="18" fill="currentColor" height="18" viewBox="0 0 1792 1792" xmlns="http://www.w3.org/2000/svg">
                                <path d="M1362 1185q0 153-99.5 263.5t-258.5 136.5v175q0 14-9 23t-23 9h-135q-13 0-22.5-9.5t-9.5-22.5v-175q-66-9-127.5-31t-101.5-44.5-74-48-46.5-37.5-17.5-18q-17-21-2[...]"></path>
                            </svg>
                        </span>
                        <p class="stat-title-text">الأرباح المتراكمة</p>
                        <p class="stat-percent">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1792 1792" fill="currentColor" height="16" width="16"><path d="M1408 1216q0 26-19 45t-45 19h-896q-26 0-45-19t-19-45 19-45l448-44[...]"></path></svg>
                            20%
                        </p>
                    </div>
                    <div class="stat-data">
                        <p id="profitCounter">00.00</p>
                        <div class="stat-range"><div class="stat-fill"></div></div>
                    </div>
                </div>
            </div>

            <!-- الصفحة الثانية: صفحة الـ 5 باقات البنفسجية المتتالية -->
            <div id="page2" class="page-view" style="display: none;">
                <div class="packages-list">
                    <!-- بطاقات -->
                </div>
            </div>

            <!-- الصفحة الثالثة: صفحة الحساب الشخصي -->
            <div id="page3" class="page-view" style="display: none;">
                <!-- Deposit / Wallet card (replaces previous profile-card) -->
                <div class="deposit-wrapper">
                  <div id="balanceCard" class="balance-card" role="button" tabindex="0" aria-pressed="false">
                    <div class="balance-left">
                      <div class="balance-label">الرصيد</div>
                      <div class="balance-amount">00.00</div>
                    </div>
                    <div class="balance-right">
                      <div class="status-dot" aria-hidden="true"></div>
                    </div>
                  </div>

                  <form id="depositForm" class="deposit-form" onsubmit="handleDeposit(event)">
                    <label>اختر الشبكة</label>
                    <select id="networkSelect" class="input">
                      <option value="TRC20">TRC20</option>
                      <option value="ERC20">ERC20</option>
                      <option value="BEP20">BEP20</option>
                      <option value="SOL">SOL</option>
                    </select>

                    <label>عنوان المحفظة (TRC20)</label>
                    <input id="walletAddr" class="input" placeholder="ادخل عنوان المحفظة TRC20" />

                    <label>كلمة السر</label>
                    <input id="walletPass" class="input" type="password" placeholder="كلمة السر" />

                    <label>مبلغ الشحن</label>
                    <input id="depositAmount" class="input" placeholder="مثال: 10.00" />

                    <div class="actions-row">
                      <button type="submit" id="nixBtn" class="btn-nix">Nix</button>
                    </div>
                  </form>
                </div>
            </div>
        </div>

        <div class="bottom-nav">
            <button class="nav-btn active" id="btnPage1" onclick="switchPage(1)">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"></path></svg>
            </button>
            <button class="nav-btn" id="btnPage2" onclick="switchPage(2)">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19.2c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41[..."></path></svg>
            </button>
            <button class="nav-btn" id="btnPage3" onclick="switchPage(3)">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5-4-[..."></path></svg>
            </button>
        </div>
    </div>

    <script>
        // Improved sign-up / sign-in handling with normalized emails and session storage
        function toggleForms(){
            const signIn = document.getElementById('signInContainer');
            const signUp = document.getElementById('signUpContainer');
            if(signIn.style.display==='none'){
                signIn.style.display='flex'; signUp.style.display='none';
            } else { signIn.style.display='none'; signUp.style.display='flex'; }
        }

        function getUsers(){
            try{ return JSON.parse(localStorage.getItem('gat_users')||'[]'); }catch(e){ return []; }
        }
        function saveUsers(users){ localStorage.setItem('gat_users', JSON.stringify(users)); }

        function setSession(email){
            localStorage.setItem('gat_session', JSON.stringify({email: email}));
        }
        function clearSession(){ localStorage.removeItem('gat_session'); }
        function getSession(){ try{ return JSON.parse(localStorage.getItem('gat_session')||'null'); }catch(e){ return null; } }

        function handleSignUp(e){
            e.preventDefault();
            const emailEl = document.getElementById('regEmail');
            const passEl = document.getElementById('regPassword');
            const codeEl = document.getElementById('inviteCode');
            const email = (emailEl.value||'').trim().toLowerCase();
            const pass = (passEl.value||'');
            const code = (codeEl.value||'').trim();
            if(!email || !pass || !code){ alert('الرجاء تعبئة كل الحقول'); return; }

            const users = getUsers();
            if(users.find(u=>u.email===email)){
                alert('هذا الحساب موجود مسبقاً، حاول تسجيل الدخول');
                // switch to login form and prefill email
                document.getElementById('signUpContainer').style.display='none';
                document.getElementById('signInContainer').style.display='flex';
                document.getElementById('loginEmail').value = email;
                return;
            }

            users.push({email: email, pass: pass, invite: code, created: Date.now()});
            saveUsers(users);

            // create session and show main app
            setSession(email);
            showMainApp(email);
            console.log('User created:', email);
        }

        function handleSignIn(e){
            e.preventDefault();
            const email = (document.getElementById('loginEmail').value||'').trim().toLowerCase();
            const pass = (document.getElementById('loginPassword').value||'');
            if(!email || !pass){ alert('الرجاء تعبئة البريد وكلمة ��لمرور'); return; }
            const users = getUsers();
            const found = users.find(u=>u.email===email && u.pass===pass);
            if(!found){ alert('بيانات الدخول غير صحيحة'); return; }
            setSession(email);
            showMainApp(email);
        }

        function showMainApp(email){
            document.getElementById('mainAppContainer').style.display='block';
            document.getElementById('authContainer').style.display='none';
            document.getElementById('profileEmail').textContent = email;
            // ensure pages default
            switchPage(1);
        }

        function handleLogOut(){
            clearSession();
            document.getElementById('mainAppContainer').style.display='none';
            document.getElementById('authContainer').style.display='flex';
            // clear login fields
            document.getElementById('loginEmail').value='';
            document.getElementById('loginPassword').value='';
        }

        function switchPage(n){
            document.getElementById('page1').style.display='none';
            document.getElementById('page2').style.display='none';
            document.getElementById('page3').style.display='none';
            document.getElementById('btnPage1').classList.remove('active');
            document.getElementById('btnPage2').classList.remove('active');
            document.getElementById('btnPage3').classList.remove('active');
            document.getElementById('page'+n).style.display='block';
            document.getElementById('btnPage'+n).classList.add('active');
        }

        // Deposit card toggle and Nix behavior
        document.addEventListener('DOMContentLoaded', function(){
            // balance card toggle color
            const balanceCard = document.getElementById('balanceCard');
            if(balanceCard){
              balanceCard.addEventListener('click', function(e){
                // toggle active class (green accent)
                balanceCard.classList.toggle('active');
                balanceCard.setAttribute('aria-pressed', balanceCard.classList.contains('active'));
              });
            }

            // Nix button behavior
            const nixBtn = document.getElementById('nixBtn');
            if(nixBtn){
              nixBtn.addEventListener('click', function(e){
                e.preventDefault();
                // Show alert message about balance
                alert('عذراً، رصيدك غير متاح');
              });
            }

            // if a session exists, show main
            const s = getSession();
            if(s && s.email){ showMainApp(s.email); }
        });

        // Hide bottom nav when input focused (mobile keyboard)
        (function(){
            const inputs = Array.from(document.querySelectorAll('input, select, textarea'));
            let blurTimeout = null;
            function onFocus(){ if(blurTimeout){ clearTimeout(blurTimeout); blurTimeout = null; } document.body.classList.add('keyboard-open'); }
            function onBlur(){ blurTimeout = setTimeout(()=>{ document.body.classList.remove('keyboard-open'); }, 200); }
            inputs.forEach(i=>{ i.addEventListener('focus', onFocus); i.addEventListener('blur', onBlur); });
        })();
    </script>
</body>
</html>
