<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>واجهة ذهبية</title>
    <style>
        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .gold-form-container {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .gold-form {
            width: 285px;
            height: auto;
            background: #e4be42;
            box-shadow: inset -4px -4px 8px #bd9c2c, inset 4px 4px 8px #e4be42, 4px 4px 12px rgba(0, 0, 0, 0.452);
            border-radius: 24px;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .gold-input {
            width: 100%;
            height: 45px;
            background: #e4be42;
            box-shadow: inset 4px 4px 6px #bd9c2c, inset -4px -4px 6px #ffe259;
            border: none;
            border-radius: 12px;
            padding: 5px 15px;
            color: #53430f;
            font-weight: bold;
            outline: none;
            font-size: 16px;
        }

        .gold-label {
            align-self: flex-start;
            color: #53430f;
            font-weight: bold;
            font-size: 12px;
            margin-right: 5px;
        }

        .gold-btn {
            width: 100%;
            height: 45px;
            background: #e4be42;
            box-shadow: 3px 3px 6px #bd9c2c, -3px -3px 6px #ffe259;
            border: none;
            border-radius: 12px;
            color: #53430f;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s ease-in-out;
            margin-top: 10px;
        }

        .gold-btn:active {
            box-shadow: inset 3px 3px 6px #bd9c2c, inset -3px -3px 6px #ffe259;
        }
    </style>
</head>
<body>

    <div class="gold-form-container">
        <form class="gold-form">
            <h2 style="color: #53430f; font-size: 20px; margin-bottom: 10px;">تسجيل الدخول</h2>
            
            <span class="gold-label">اسم المستخدم</span>
            <input type="text" class="gold-input" placeholder="أدخل الاسم" required>
            
            <span class="gold-label">كلمة المرور</span>
            <input type="password" class="gold-input" placeholder="أدخل كلمة المرور" required>
            
            <button type="submit" class="gold-btn">SUBMIT</button>
        </form>
    </div>

</body>
</html>
