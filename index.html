<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول / إنشاء حساب</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-wrapper">
  
  <!-- حاوية اللودر الأخضر من تصميم NlghtM4re فوق المربع -->
  <div class="container" id="global-loader" style="display: none;">
    <div class="loader"></div>
  </div>

  <div class="login-card">
    <input type="checkbox" id="reg-toggle" class="reg-toggle" style="display: none;" />

    <div class="glow-blob blob-1"></div>
    <div class="glow-blob blob-2"></div>
    <div class="dark-overlay"></div>

    <div class="view-container">
      <!-- 1. واجهة تسجيل الدخول (login-view) -->
      <div class="form-view" id="login-view">
        <div class="header">
          <div class="decorative-dot"></div>
          <div class="title">Welcome Back</div>
          <p class="subtitle">Please enter your details to sign in.</p>
        </div>

        <form id="login-form">
          <div class="input-group">
            <input type="email" id="login-email" class="input-field" placeholder="Email address" required autocomplete="email" />
          </div>

          <div class="input-group">
            <input type="password" id="login-password" class="input-field" placeholder="Password" required autocomplete="current-password" />
          </div>

          <a href="#" class="forgot-link">Forgot password?</a>

          <button type="submit" class="btn-submit">Sign In</button>
        </form>

        <div class="signup-prompt">
          Don't have an account?
          <label for="reg-toggle" class="toggle-link">Sign up</label>
        </div>
      </div>

      <!-- 2. واجهة إنشاء حساب جديد (signup-view) -->
      <div class="form-view" id="signup-view">
        <div class="header">
          <div class="decorative-dot"></div>
          <div class="title">Create Account</div>
          <p class="subtitle">Join us to get started.</p>
        </div>

        <form id="signup-form">
          <div class="input-group">
            <input type="text" id="signup-name" class="input-field" placeholder="Full Name" required autocomplete="name" />
          </div>

          <div class="input-group">
            <input type="email" id="signup-email" class="input-field" placeholder="Email address" required autocomplete="email" />
          </div>

          <div class="input-group">
            <input type="password" id="signup-password" class="input-field" placeholder="Password" required autocomplete="new-password" />
          </div>

          <div style="height: 12px;"></div>

          <button type="submit" class="btn-submit">Sign Up</button>
        </form>

        <div class="signup-prompt">
          Already have an account?
          <label for="reg-toggle" class="toggle-link">Sign in</label>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const loader = document.getElementById('global-loader');

  // إنشاء حساب والتحقق والحفظ في جهاز المستخدم ثم الانتقال التلقائي
  document.getElementById('signup-form').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const name = document.getElementById('signup-name').value;
    const email = document.getElementById('signup-email').value;
    const password = document.getElementById('signup-password').value;

    loader.style.display = 'flex';

    setTimeout(() => {
      localStorage.setItem('user_name', name);
      localStorage.setItem('user_email', email);
      localStorage.setItem('user_password', password);

      loader.style.display = 'none';
      window.location.href = 'page1.html';
    }, 2000); 
  });

  // تسجيل دخول ومطابقة البيانات المخزنة محلياً في جهازه ثم الانتقال
  document.getElementById('login-form').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const emailInput = document.getElementById('login-email').value;
    const passwordInput = document.getElementById('login-password').value;

    const savedEmail = localStorage.getItem('user_email');
    const savedPassword = localStorage.getItem('user_password');

    loader.style.display = 'flex';

    setTimeout(() => {
      loader.style.display = 'none';

      if (emailInput === savedEmail && passwordInput === savedPassword) {
        window.location.href = 'page1.html';
      } else {
        alert('خطأ: الإيميل أو الرمز غير صحيح، أو لم تقم بالتسجيل على هذا الجهاز من قبل!');
      }
    }, 2000);
  });
</script>

</body>
</html>
