<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Messages</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#fff;color:#202124;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif}
body{overflow-x:hidden}
.app{width:566px;max-width:566px;min-height:100vh;margin:0 auto;background:#fff;padding-bottom:86px;position:relative}
.header{height:120px;position:relative;display:flex;justify-content:center;align-items:flex-end;padding-bottom:20px}
.title{font-size:26px;font-weight:700;line-height:1;margin:0;letter-spacing:-.5px}
.plus-circle{position:absolute;right:25px;bottom:20px;width:30px;height:30px;border:2px solid #111;border-radius:50%;background:#fff;padding:0;font-size:27px;font-weight:300;line-height:24px;color:#111}
.search{height:47px;margin:-15px 22px 17px;border-radius:8px;background:#f7f6fa;display:flex;align-items:center;justify-content:center;padding:0 14px}
.search svg{width:22px;height:22px;stroke:#bdbdc4;stroke-width:2.3;fill:none;margin-right:8px;flex:none}
.search input{border:0;outline:0;background:transparent;width:100%;height:100%;font-size:18px;color:#333;text-align:left;flex:0 0 auto;width:82px}
.search input::placeholder{color:#bdbdc4}
.tabs{height:54px;border-bottom:1px solid #ddd;display:flex;align-items:center;padding:0 22px;gap:29px}
.tab{height:54px;border:0;background:transparent;padding:0;position:relative;font-size:20px;color:#222}
.tab.active:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:#18a790}
.count{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;margin-left:5px;border-radius:50%;background:#3ab899;color:#fff;font-size:15px;vertical-align:middle}
.tab.plus{font-size:32px;line-height:1;margin-left:2px}
.list{width:100%}
.row{height:70px;display:flex;align-items:center;padding:0 22px;gap:18px;position:relative;cursor:pointer}
.avatarBox{width:43px;height:43px;flex:0 0 43px;position:relative}
.avatar{width:43px;height:43px;border-radius:50%;display:block;object-fit:cover}
.fallback{width:43px;height:43px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:21px;font-weight:600}
.a1{background:linear-gradient(135deg,#dfe84b,#37a978)}
.a2{background:linear-gradient(135deg,#d9d4cd,#8c7968)}
.a3{background:linear-gradient(135deg,#2b211c,#655042)}
.a4{background:radial-gradient(circle,#fff 0 12%,#50c8b5 13% 24%,#e0ffff 25% 35%,#54cfc1 36% 55%,#baf5ec 56%)}
.info{min-width:0;flex:1}
.name{font-size:17px;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.preview{font-size:14px;line-height:17px;color:#aaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pinned{color:#965267;font-weight:600}
.time{font-size:13px;color:#aaa;white-space:nowrap;margin-left:4px}
.badge{position:absolute;right:-7px;top:-5px;min-width:25px;height:24px;padding:0 6px;border-radius:13px;background:#e84562;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;line-height:24px;z-index:3;white-space:nowrap}
.badge:empty{display:none}
.bottom{position:fixed;z-index:20;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:566px;height:78px;border-top:1px solid #ddd;background:#fff;display:flex;align-items:center;justify-content:space-around}
.bottom button{width:33.333%;height:78px;border:0;background:transparent;position:relative;display:flex;align-items:center;justify-content:center}
.bottom svg{width:34px;height:34px;fill:none;stroke:#aaa;stroke-width:1.6}
.bottom .active svg{stroke:#18aa92;color:#18aa92}
.msg-badge{position:absolute;top:8px;right:25%;background:#e84562;color:#fff;border-radius:16px;padding:3px 8px;font-size:13px;line-height:18px}
#filePicker{display:none}
@media(max-width:565px){
 .app{width:100%;max-width:100%}.bottom{width:100%}.search{margin-left:22px;margin-right:22px}
 .tabs{padding-left:20px;gap:23px}
 .row{padding-left:18px;padding-right:18px;gap:14px}
}

/* Chat screen */
.chat-screen{display:none;position:fixed;inset:0;background:#fff;z-index:50;max-width:566px;margin:0 auto;min-height:100vh}
.chat-header{height:76px;border-bottom:1px solid #e5e5e5;display:flex;align-items:center;padding:0 16px;gap:14px;background:#fff}
.chat-back{width:36px;height:40px;border:0;background:transparent;font-size:34px;line-height:1;font-weight:300;color:#222;padding:0;cursor:pointer}
.chat-avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;display:block;background:#171717;flex:0 0 44px}
.chat-avatar-fallback{width:44px;height:44px;border-radius:50%;background:#171717;color:#fff;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;flex:0 0 44px}
.chat-head-info{min-width:0;flex:1}
.chat-name{font-size:19px;font-weight:700;line-height:23px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-online{font-size:15px;color:#36b89e;line-height:19px}
.chat-info-btn{width:34px;height:34px;border:0;background:transparent;font-size:24px;color:#222;cursor:pointer}
.unread-strip{height:58px;background:#effcf9;color:#31ae97;display:flex;align-items:center;justify-content:center;font-size:17px}
.chat-body{position:absolute;left:0;right:0;top:134px;bottom:104px;overflow-y:auto;padding:18px 18px 28px;display:flex;flex-direction:column;gap:9px}
.message-row{display:flex;align-items:flex-start;gap:8px;max-width:88%;align-self:flex-start}
.message-avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;flex:0 0 38px;margin-top:18px}
.message-content{min-width:0}
.message-sender{font-size:14px;color:#999;margin:0 0 3px 6px;line-height:18px}
.message{max-width:100%;padding:10px 13px 8px;border-radius:13px;background:#f1f2f3;color:#222;font-size:19px;line-height:25px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.message.mine{align-self:flex-end;background:#dff8f1}
.message-row.mine{align-self:flex-end;justify-content:flex-end}
.message-row.mine .message-avatar,.message-row.mine .message-sender{display:none}
.message .msg-time{display:block;text-align:right;color:#999;font-size:11px;line-height:14px;margin-top:2px}
.chat-composer{position:absolute;left:12px;right:12px;bottom:10px;min-height:74px;border:1px solid #ececec;border-radius:16px;background:#fff;box-shadow:0 1px 7px rgba(0,0,0,.05);padding:9px 8px 7px;display:flex;flex-direction:column}
.chat-input{border:0;outline:0;resize:none;width:100%;height:34px;font:18px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#333;padding:2px 9px}
.chat-input::placeholder{color:#bcbec2}
.chat-tools{height:30px;display:flex;align-items:center;gap:19px;padding:0 8px}
.tool{border:0;background:transparent;font-size:25px;line-height:1;color:#222;padding:0;cursor:pointer}
.send-btn{margin-left:auto;border:0;background:#f6f8f8;color:#dfe3e3;width:35px;height:30px;border-radius:8px;font-size:20px;cursor:pointer}
.send-btn.ready{color:#20ad93;background:#e7faf5}
</style>
</head>
<body>
<div class="app" id="homeScreen">
  <header class="header">
    <h1 class="title">Messages</h1>
    <button class="plus-circle" aria-label="new message">+</button>
  </header>

  <div class="search">
    <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.8"/><path d="M16 16l5 5"/></svg>
    <input id="search" placeholder="Search" autocomplete="off">
  </div>

  <div class="tabs">
    <button class="tab active">All <span class="count">4</span></button>
    <button class="tab">Unread <span class="count">4</span></button>
    <button class="tab plus">+</button>
  </div>

  <main class="list" id="list"></main>

  <nav class="bottom">
    <button class="active" aria-label="Messages">
      <svg viewBox="0 0 48 48"><path d="M8 12h32a4 4 0 0 1 4 4v18a4 4 0 0 1-4 4H22l-9 7v-7H8a4 4 0 0 1-4-4V16a4 4 0 0 1 4-4Z"/><circle cx="16" cy="25" r="2" fill="currentColor" stroke="none"/><circle cx="24" cy="25" r="2" fill="currentColor" stroke="none"/><circle cx="32" cy="25" r="2" fill="currentColor" stroke="none"/></svg>
      <span class="msg-badge">1.2K</span>
    </button>
    <button aria-label="Contacts">
      <svg viewBox="0 0 48 48"><rect x="10" y="7" width="28" height="34" rx="2"/><circle cx="24" cy="18" r="5"/><path d="M16 33c2-5 14-5 16 0M6 13v22M42 13v22"/></svg>
    </button>
    <button aria-label="Profile">
      <svg viewBox="0 0 48 48"><circle cx="24" cy="14" r="7.5"/><path d="M11 41c1-9 6-14 13-14s12 5 13 14"/></svg>
    </button>
  </nav>
</div>

<section class="chat-screen" id="chatScreen" aria-label="Report a problem chat">
  <header class="chat-header">
    <button class="chat-back" id="chatBack" aria-label="Back">‹</button>
    <div id="chatAvatarWrap"></div>
    <div class="chat-head-info">
      <div class="chat-name">Report a problem</div>
      <div class="chat-online">Online</div>
    </div>
    <button class="chat-info-btn" aria-label="Info">ⓘ</button>
  </header>
  <div class="unread-strip">Unread messages ↓</div>
  <main class="chat-body" id="chatBody"></main>
  <form class="chat-composer" id="chatForm">
    <textarea class="chat-input" id="chatInput" placeholder="Hello..." autocomplete="off"></textarea>
    <div class="chat-tools">
      <button class="tool" type="button">⊕</button>
      <button class="tool" type="button">☺</button>
      <button class="tool" type="button">▧</button>
      <button class="tool" type="button">▣</button>
      <button class="tool" type="button">▱</button>
      <button class="tool" type="button">♩</button>
      <button class="send-btn" id="sendBtn" type="submit">➤</button>
    </div>
  </form>
</section>

<input id="filePicker" type="file" accept="image/*">
<input id="chatAvatarPicker" type="file" accept="image/*" style="display:none">

const list=document.getElementById("list");
const search=document.getElementById("search");
const picker=document.getElementById("filePicker");
const chatAvatarPicker=document.getElementById("chatAvatarPicker");
const homeScreen=document.getElementById("homeScreen");
const chatScreen=document.getElementById("chatScreen");
const chatBody=document.getElementById("chatBody");
const chatBack=document.getElementById("chatBack");
const chatForm=document.getElementById("chatForm");
const chatInput=document.getElementById("chatInput");
const sendBtn=document.getElementById("sendBtn");
const chatAvatarWrap=document.getElementById("chatAvatarWrap");
let selectedIndex=0;

function stored(key){try{return localStorage.getItem("bonchat_"+key)||""}catch(e){return""}}
function render(){
 const q=search.value.trim().toLowerCase();
 list.innerHTML="";
 chats.forEach((c,i)=>{
   if(q && !(c.name+" "+c.preview).toLowerCase().includes(q)) return;
   const row=document.createElement("div");
   row.className="row";
   const saved=stored(c.key);
   row.innerHTML=`
    <div class="avatarBox">
      ${saved?`<img class="avatar" src="${saved}" alt="">`:`<div class="fallback ${c.cls}">${i===0?"USA2":i===1?"◆":i===2?"◇":"◎"}</div>`}
      <div class="badge">${c.badge}</div>
    </div>
    <div class="info">
      <div class="name">${c.name}</div>
      <div class="preview ${i<3?"pinned":""}">${c.preview}</div>
    </div>
    <div class="time">${c.time}</div>`;
   row.querySelector(".avatarBox").onclick=(e)=>{
     e.stopPropagation();
     selectedIndex=i;
     picker.value="";
     picker.click();
   };
   row.onclick=()=>{
     if(i===3) openChat();
   };
   list.appendChild(row);
 });
}

function renderChatAvatar(){
 const saved=stored("g4");
 chatAvatarWrap.innerHTML=saved?`<img class="chat-avatar" id="chatAvatar" src="${saved}" alt="Report a problem">`:`<div class="chat-avatar-fallback" id="chatAvatar">G</div>`;
 document.getElementById("chatAvatar").onclick=()=>{chatAvatarPicker.value="";chatAvatarPicker.click()};
}
function openChat(){
 homeScreen.style.display="none";
 chatScreen.style.display="block";
 renderChatAvatar();
 chatBody.innerHTML="";
 codeMessages.forEach((item,idx)=>addMessage(item.code,false,idx,item.time));
 requestAnimationFrame(()=>{chatBody.scrollTop=chatBody.scrollHeight});
}
function closeChat(){
 chatScreen.style.display="none";
 homeScreen.style.display="block";
}
function addMessage(text,mine=false,idx=0,time="16:31"){
 const row=document.createElement("div");
 row.className="message-row"+(mine?" mine":"");
 if(!mine){
   row.innerHTML=`<img class="message-avatar" src="${liseAvatar}" alt="Lise"><div class="message-content"><div class="message-sender">Lise</div><div class="message">${text}<span class="msg-time">${time}</span></div></div>`;
 }else{
   row.innerHTML=`<div class="message mine">${text}<span class="msg-time">${time}</span></div>`;
 }
 chatBody.appendChild(row);
}
function sendChunks(raw){
 const digits=raw.replace(/\D/g,"");
 if(!digits)return;
 let t=new Date();
 for(let i=0;i<digits.length;i+=5){
   const chunk=digits.slice(i,i+5);
   if(chunk.length===5){
     const hh=String(t.getHours()).padStart(2,"0");
     const mm=String(t.getMinutes()).padStart(2,"0");
     addMessage(chunk,true,0,`${hh}:${mm}`);
     t.setMinutes(t.getMinutes()+1);
   }
 }
 chatBody.scrollTop=chatBody.scrollHeight;
}

picker.onchange=()=>{
 const file=picker.files&&picker.files[0];
 if(!file)return;
 const reader=new FileReader();
 reader.onload=()=>{
   try{localStorage.setItem("bonchat_"+chats[selectedIndex].key,reader.result)}catch(e){}
   render();
 };
 reader.readAsDataURL(file);
};
chatAvatarPicker.onchange=()=>{
 const file=chatAvatarPicker.files&&chatAvatarPicker.files[0];
