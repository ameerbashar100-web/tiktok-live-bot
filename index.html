<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Messages</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <h1>Messages</h1>
    <button class="new-btn" aria-label="New message">+</button>
  </header>

  <section class="search-box">
    <span class="search-icon">⌕</span>
    <input id="search" type="search" placeholder="Search" autocomplete="off">
  </section>

  <section class="tabs">
    <button class="tab active">All <span>4</span></button>
    <button class="tab">Unread <span>4</span></button>
    <button class="tab plus-tab">+</button>
  </section>

  <main id="chatList"></main>

  <nav class="bottom-nav">
    <button class="bottom-item active">
      <span class="chat-icon">•••</span><b>1.2K</b>
    </button>
    <button class="bottom-item"><span class="contacts-icon">▧</span></button>
    <button class="bottom-item"><span class="profile-icon">♙</span></button>
  </nav>
</div>
<script src="app.js"></script>
</body>
</html>
