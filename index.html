<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ACCE — تسجيل المستخدم</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#eef6fb;--card:#ffffff;--muted:#6b7280;--accent:#0b63c5}
    *{box-sizing:border-box}
    body{margin:0;font-family:'Cairo',sans-serif;background:linear-gradient(180deg,#f4f8fb,#eef6fb);color:#07102a}
    .page{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:28px}
    .panel{width:420px;max-width:96%;}

    .topbar{display:flex;align-items:center;gap:12px;margin-bottom:6px}
    .logo{font-size:42px;font-weight:900;color:#3b6fbf;letter-spacing:2px}
    .icons{margin-left:auto;display:flex;gap:10px;align-items:center}
    .flag{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff;box-shadow:0 6px 18px rgba(11,32,64,0.06)}
    .clock{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:transparent;color:#374151}

    .title{font-size:34px;text-align:center;font-weight:800;margin:6px 0 12px}

    .card{background:linear-gradient(180deg,#ffffff,#f7fbff);border-radius:16px;padding:18px;box-shadow:0 12px 40px rgba(2,6,23,0.06);border:1px solid rgba(11,32,64,0.03)}
    .field{margin-bottom:16px}
    label{display:block;font-weight:700;color:#0b3a66;margin-bottom:8px}
    .input{width:100%;padding:14px;border-radius:10px;border:1px solid rgba(10,20,40,0.06);background:rgba(250,252,255,0.9);font-size:15px;color:#2b3e50}

    .phone-row{display:flex;gap:10px;align-items:flex-start;flex-direction:column}
    .codeFull{width:100%;padding:12px;border-radius:10px;border:1px solid rgba(10,20,40,0.06);background:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}

    .captcha{display:flex;align-items:center;gap:8px;padding:8px;border-radius:10px;background:#fff;border:1px solid rgba(10,20,40,0.04)}
    .captcha .text{font-weight:800;color:#8b5cf6;padding:8px 12px;border-radius:8px;background:linear-gradient(90deg,#fff,#f3f6ff)}
    .captcha input{flex:1;padding:10px;border-radius:8px;border:1px solid rgba(10,20,40,0.04)}

    .invite{display:flex;align-items:center;gap:8px}
    .invite .box{flex:1;padding:12px;border-radius:10px;background:#fff;border:1px solid rgba(10,20,40,0.04);}
    .invite input{width:100%;padding:12px;border-radius:10px;border:1px solid rgba(10,20,40,0.06);font-weight:800;letter-spacing:2px;text-transform:lowercase}

    .checkbox{display:flex;align-items:center;gap:8px;margin-top:6px}

    .bottom-links{display:flex;justify-content:center;gap:12px;margin-top:14px}
    .link{color:#2b63b8;font-weight:700;text-decoration:none;font-size:18px}

    .message{display:none;padding:12px;border-radius:8px;margin-top:10px;background:#ffecec;color:#8a0b0b;font-weight:700}

    footer{height:90px}

    @media (max-width:440px){.card{padding:14px}.title{font-size:28px}}
  </style>
</head>
<body>
  <div class="page">
    <div class="panel">
      <div class="topbar">
        <div class="logo">ACCE</div>
        <div class="icons">
          <div class="flag" id="topFlag" title="Foreign">🇦🇺</div>
          <div class="clock">⏲️</div>
        </div>
      </div>

      <div class="title">تسجيل المستخدم</div>

      <div class="card" role="main" aria-label="نموذج التسجيل">

        <div class="field">
          <label>هاتف)gmali</label>
          <div class="phone-row">
            <!-- full-width country box showing only a flag/text (Australia by default) -->
            <div class="codeFull" id="countryBox">🇦🇺</div>
            <input class="input" id="phone" placeholder="07xxxxxxxx" aria-label="رقم الهاتف">
          </div>
        </div>

        <div class="field">
          <label>كلمة المرور</label>
          <input class="input" id="pass" type="password" placeholder="Password">
        </div>

        <div class="field">
          <label>تأكيد كلمة المرور</label>
          <input class="input" id="pass2" type="password" placeholder="Confirm Password">
        </div>

        <div class="field">
          <label>الكابتشا الرسومية</label>
          <div class="captcha">
            <div class="text" id="captchaText">hyv6</div>
            <input id="captchaInput" placeholder="" aria-label="كابتشا" />
          </div>
        </div>

        <div class="field">
          <label>رمز الدعوة</label>
          <div class="invite">
            <input id="inviteInput" maxlength="5" value="" aria-label="رمز الدعوة" />
            <div style="opacity:0.6;cursor:pointer" id="inviteClear">✖</div>
          </div>
        </div>

        <div class="checkbox">
          <input type="checkbox" id="agree"><label for="agree">لقد قرأت وأوافق على اتفاقية التسجيل</label>
        </div>

        <div class="message" id="msg">عذراً، ليس لديك حساب مسبقاً.</div>

        <div class="bottom-links">
          <a class="link" href="#" id="createLink">إنشاء حساب</a>
          <span style="color:#9aa7c9">·</span>
          <a class="link" href="#" id="loginLink">تسجيل دخول</a>
        </div>

      </div>

      <footer></footer>
    </div>
  </div>

  <script>
    // Behavior updates per your request:
    // - default shows Australian flag in the full-width countryBox (no text)
    // - when user types a phone starting with '077' -> show Iraq flag
    // - captcha: remove instruction text and show captcha string 'hyv6' visually; user types in input
    // - invite: editable input limited to 5 letters; prefilled with random 5-letter code; clear button

    function rand5(){
      const letters = 'abcdefghijklmnopqrstuvwxyz';
      let s='';
      for(let i=0;i<5;i++) s += letters[Math.floor(Math.random()*letters.length)];
      return s;
    }

    const countryBox = document.getElementById('countryBox');
    const topFlag = document.getElementById('topFlag');
    const phoneInput = document.getElementById('phone');
    const msg = document.getElementById('msg');
    const captchaText = document.getElementById('captchaText');
    const captchaInput = document.getElementById('captchaInput');
    const inviteInput = document.getElementById('inviteInput');
    const inviteClear = document.getElementById('inviteClear');

    // set defaults
    countryBox.textContent = '🇦🇺';
    topFlag.textContent = '🇦🇺';

    // prefill invite with 5 random letters
    inviteInput.value = rand5();

    // clear invite
    inviteClear.addEventListener('click', ()=>{ inviteInput.value = ''; inviteInput.focus(); });

    // restrict invite input to letters only and lowercase, max 5
    inviteInput.addEventListener('input', function(){
      this.value = this.value.replace(/[^a-zA-Z]/g,'').toLowerCase().slice(0,5);
      if(this.value.length === 0){ /* keep generated? user asked editable so keep empty */ }
    });

    // phone detection: if starts with '077' show Iraq; otherwise Australia
    phoneInput.addEventListener('input', function(){
      const v = this.value.replace(/\D/g,'');
      if(v.startsWith('077')){
        countryBox.textContent = '🇮🇶';
        topFlag.textContent = '🇮🇶';
      } else {
        countryBox.textContent = '🇦🇺';
        topFlag.textContent = '🇦🇺';
      }
    });

    // login behavior
    document.getElementById('loginLink').addEventListener('click', function(e){
      e.preventDefault();
      msg.textContent = 'عذراً، ليس لديك حساب مسبقاً.';
      msg.style.display = 'block';
      msg.scrollIntoView({block:'center',behavior:'smooth'});
    });

    // create behavior: check captcha matches displayed text; invite length 5 letters
    document.getElementById('createLink').addEventListener('click', function(e){
      e.preventDefault();
      const phone = phoneInput.value.trim();
      const p1 = document.getElementById('pass').value;
      const p2 = document.getElementById('pass2').value;
      const agree = document.getElementById('agree').checked;
      const inviteVal = inviteInput.value.trim();
      msg.style.display='none';
      if(!phone || !p1 || !p2){ msg.textContent='الرجاء تعبئة كل الحقول.'; msg.style.display='block'; return; }
      if(p1 !== p2){ msg.textContent='كلمتا المرور غير متطابقتين.'; msg.style.display='block'; return; }
      if(!agree){ msg.textContent='يجب الموافقة على اتفاقية التسجيل.'; msg.style.display='block'; return; }
      if((captchaInput.value || '').trim() !== captchaText.textContent.trim()){ msg.textContent='كود الكابتشا غير مطابق.'; msg.style.display='block'; return; }
      if(inviteVal.length !== 5){ msg.textContent='رمز الدعوة يجب أن يكون 5 أحرف إنجليزية.'; msg.style.display='block'; return; }
      alert('تم إنشاء الحساب (محاكاة). انت الآن على الصفحة الرئيسية.');
      document.body.innerHTML = '<div style="font-family: Cairo, sans-serif; padding:18px; text-align:center;"><h2>الصفحة الرئيسية — الباقات والمهام</h2><p>عرض الباقات سيتم هنا.</p></div>';
    });

  </script>
</body>
</html>
