<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Messages</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#fff;color:#202124;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif}
body{overflow-x:hidden}
.app{width:100%;max-width:566px;min-height:100vh;margin:auto;background:#fff;padding-bottom:86px;position:relative}
.header{height:113px;position:relative;display:flex;justify-content:center;align-items:flex-end;padding-bottom:20px}
.title{font-size:28px;font-weight:600;line-height:1;margin:0;letter-spacing:-.5px}
.plus-circle{position:absolute;right:25px;bottom:14px;width:35px;height:35px;border:2px solid #111;border-radius:50%;background:#fff;padding:0;font-size:30px;font-weight:300;line-height:28px;color:#111}
.search{height:58px;margin:0 34px 18px;border-radius:14px;background:#f7f6fa;display:flex;align-items:center;padding:0 19px}
.search svg{width:29px;height:29px;stroke:#bdbdc4;stroke-width:2.3;fill:none;margin-right:10px;flex:none}
.search input{border:0;outline:0;background:transparent;width:100%;height:100%;font-size:22px;color:#333}
.search input::placeholder{color:#bdbdc4}
.tabs{height:54px;border-bottom:1px solid #ddd;display:flex;align-items:center;padding:0 22px;gap:29px}
.tab{height:54px;border:0;background:transparent;padding:0;position:relative;font-size:20px;color:#222}
.tab.active:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:#18a790}
.count{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;margin-left:5px;border-radius:50%;background:#3ab899;color:#fff;font-size:15px;vertical-align:middle}
.tab.plus{font-size:32px;line-height:1;margin-left:2px}
.list{width:100%}
.row{height:96px;display:flex;align-items:center;padding:0 22px;gap:18px;position:relative;cursor:pointer}
.avatarBox{width:55px;height:55px;flex:0 0 55px;position:relative}
.avatar{width:55px;height:55px;border-radius:50%;display:block;object-fit:cover}
.fallback{width:55px;height:55px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:21px;font-weight:600}
.a1{background:linear-gradient(135deg,#dfe84b,#37a978)}
.a2{background:linear-gradient(135deg,#d9d4cd,#8c7968)}
.a3{background:linear-gradient(135deg,#2b211c,#655042)}
.a4{background:radial-gradient(circle,#fff 0 12%,#50c8b5 13% 24%,#e0ffff 25% 35%,#54cfc1 36% 55%,#baf5ec 56%)}
.info{min-width:0;flex:1}
.name{font-size:19px;line-height:23px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.preview{font-size:16px;line-height:20px;color:#aaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pinned{color:#965267;font-weight:600}
.time{font-size:15px;color:#aaa;white-space:nowrap;margin-left:4px}
.badge{position:absolute;left:40px;top:9px;transform:translateX(17px);min-width:27px;height:28px;padding:0 7px;border-radius:15px;background:#e84562;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;z-index:2}
.bottom{position:fixed;z-index:20;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:566px;height:82px;border-top:1px solid #ddd;background:#fff;display:flex;align-items:center;justify-content:space-around}
.bottom button{width:33.333%;height:82px;border:0;background:transparent;position:relative;display:flex;align-items:center;justify-content:center}
.bottom svg{width:34px;height:34px;fill:none;stroke:#aaa;stroke-width:1.8}
.bottom .active svg{stroke:#18aa92}
.msg-badge{position:absolute;top:10px;right:31%;background:#e84562;color:#fff;border-radius:16px;padding:4px 9px;font-size:13px;line-height:18px}
#filePicker{display:none}
@media(max-width:380px){
 .search{margin-left:25px;margin-right:25px}
 .tabs{padding-left:20px;gap:23px}
 .row{padding-left:18px;padding-right:18px;gap:14px}
}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <h1 class="title">Messages</h1>
    <button class="plus-circle" aria-label="new message">+</button>
  </header>

  <div class="search">
    <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.8"/><path d="M16 16l5 5"/></svg>
    <input id="search" placeholder="Search" autocomplete="off">
  </div>

  <div class="tabs">
    <button class="tab active">All <span class="count">4</span></button>
    <button class="tab">Unread <span class="count">4</span></button>
    <button class="tab plus">+</button>
  </div>

  <main class="list" id="list"></main>

  <nav class="bottom">
    <button class="active" aria-label="Messages">
      <svg viewBox="0 0 48 48"><path d="M8 12h32a4 4 0 0 1 4 4v18a4 4 0 0 1-4 4H22l-9 7v-7H8a4 4 0 0 1-4-4V16a4 4 0 0 1 4-4Z"/><circle cx="16" cy="25" r="2" fill="currentColor" stroke="none"/><circle cx="24" cy="25" r="2" fill="currentColor" stroke="none"/><circle cx="32" cy="25" r="2" fill="currentColor" stroke="none"/></svg>
      <span class="msg-badge">1.2K</span>
    </button>
    <button aria-label="Contacts">
      <svg viewBox="0 0 48 48"><rect x="10" y="7" width="28" height="34" rx="2"/><circle cx="24" cy="18" r="5"/><path d="M16 33c2-5 14-5 16 0M6 13v22M42 13v22"/></svg>
    </button>
    <button aria-label="Profile">
      <svg viewBox="0 0 48 48"><circle cx="24" cy="14" r="8"/><path d="M9 42c1-10 7-15 15-15s14 5 15 15"/><circle cx="24" cy="27" r="17"/></svg>
    </button>
  </nav>
</div>

<input id="filePicker" type="file" accept="image/*">

<script>
const chats=[
 {name:"USA2 Oak Crypto (California) Signal Trading",preview:"[Arthur Brooks  (California)  pinned message] Susan: ¡B...",time:"09:43",badge:"1.2K",cls:"a1",key:"g1"},
 {name:"Grupo Marycarmen",preview:"[NinaUSA2  (California)  pinned message] Cecy: Gracias...",time:"09:18",badge:"9",cls:"a2",key:"g2"},
 {name:"Oak Crypto's Growth Trajectory - Group",preview:"[NinaPeru pinned message] NinaUSA  (Texas) : Se...",time:"Wednesday",badge:"29",cls:"a3",key:"g3"},
 {name:"Arthur Brooks  (California)",preview:"¿Qué planes tienes hoy? ¿Con qué amigos c...",time:"Wednesday",badge:"1",cls:"a4",key:"g4"}
];
const list=document.getElementById("list");
const search=document.getElementById("search");
const picker=document.getElementById("filePicker");
let selectedIndex=0;

function stored(key){try{return localStorage.getItem("bonchat_"+key)||""}catch(e){return""}}
function render(){
 const q=search.value.trim().toLowerCase();
 list.innerHTML="";
 chats.forEach((c,i)=>{
   if(q && !(c.name+" "+c.preview).toLowerCase().includes(q)) return;
   const row=document.createElement("div");
   row.className="row";
   const saved=stored(c.key);
   row.innerHTML=`
    <div class="avatarBox">
      ${saved?`<img class="avatar" src="${saved}" alt="">`:`<div class="fallback ${c.cls}">${i===0?"USA2":i===1?"◆":i===2?"◇":"◎"}</div>`}
      <div class="badge">${c.badge}</div>
    </div>
    <div class="info">
      <div class="name">${c.name}</div>
      <div class="preview ${i<3?"pinned":""}">${c.preview}</div>
    </div>
    <div class="time">${c.time}</div>`;
   row.querySelector(".avatarBox").onclick=(e)=>{
     e.stopPropagation();
     selectedIndex=i;
     picker.value="";
     picker.click();
   };
   list.appendChild(row);
 });
}
picker.onchange=()=>{
 const file=picker.files&&picker.files[0];
 if(!file)return;
 const reader=new FileReader();
 reader.onload=()=>{
   try{localStorage.setItem("bonchat_"+chats[selectedIndex].key,reader.result)}catch(e){}
   render();
 };
 reader.readAsDataURL(file);
};
search.addEventListener("input",render);
render();
</script>
</body>
</html>
