<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Simple To‑Do (localStorage)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app" role="application" aria-label="To-do application">
    <h1>To‑Do List</h1>

    <form id="todoForm" class="todo-form" aria-label="Add todo">
      <input id="todoInput" type="text" autocomplete="off" placeholder="Add a new task and press Enter" aria-label="New todo" />
      <button type="submit" aria-label="Add">Add</button>
    </form>

    <section class="controls">
      <div class="filters" role="tablist" aria-label="Filter tasks">
        <button class="filter-btn active" data-filter="all" role="tab" aria-selected="true">All</button>
        <button class="filter-btn" data-filter="active" role="tab" aria-selected="false">Active</button>
        <button class="filter-btn" data-filter="completed" role="tab" aria-selected="false">Completed</button>
      </div>

      <div class="actions">
        <button id="toggleAllBtn" title="Toggle all tasks complete">Toggle All</button>
        <button id="clearCompletedBtn" title="Clear completed tasks">Clear Completed</button>
      </div>
    </section>

    <ul id="todoList" class="todo-list" aria-live="polite" aria-label="Tasks"></ul>

    <footer class="footer">
      <div class="counts" aria-live="polite"><span id="count">0</span> items</div>
      <div class="import-export">
        <button id="exportBtn">Export</button>
        <input id="importFile" type="file" accept="application/json" />
        <button id="importBtn">Import</button>
      </div>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
