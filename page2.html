<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>UIVERSE</title>

    <link rel="stylesheet" href="style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            background: #000;
            color: white;
            overflow-x: hidden;
        }

        /* =========================
           الشعار المتحرك
        ========================= */

        .logo-area {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-top: 35px;
            padding-bottom: 25px;
        }

        .shine {
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 1px;

            color: rgba(255, 255, 255, 0.3);

            background-image: linear-gradient(
                -40deg,
                transparent 0%,
                transparent 40%,
                #ffffff 50%,
                transparent 60%,
                transparent 100%
            );

            background-repeat: no-repeat;
            background-size: 80px 100%;

            -webkit-background-clip: text;
            background-clip: text;

            -webkit-text-fill-color: rgba(255, 255, 255, 0.3);

            animation: shine 5s linear infinite;
        }

        @keyframes shine {
            0% {
                background-position: -250px 0;
            }

            20% {
                background-position: 0 0;
            }

            100% {
                background-position: 300px 0;
            }
        }


        /* =========================
           الفيديو
        ========================= */

        .video-area {
            width: 100%;
            padding: 0 15px 140px;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .video-box {
            width: 100%;
            max-width: 700px;

            background: #111;

            border-radius: 15px;

            overflow: hidden;

            box-shadow:
                0 0 20px rgba(255, 255, 255, 0.08);
        }

        .video-box video {
            width: 100%;
            height: auto;

            display: block;

            background: #000;

            border-radius: 15px;
        }


        /* =========================
           شريط التنقل السفلي
        ========================= */

        .custom-nav-bar {
            position: fixed;

            left: 0;
            right: 0;
            bottom: 0;

            width: 100%;

            display: flex;
            justify-content: center;

            padding: 12px 20px;

            z-index: 9999;
        }

        .nav-buttons-box {
            width: min(620px, 92vw);

            min-height: 90px;

            background: #ffffff;

            border-radius: 35px;

            display: flex;

            align-items: center;

            justify-content: space-around;

            padding: 10px 25px;

            box-shadow:
                0 5px 30px rgba(0, 0, 0, 0.35);
        }

        .nav-item {
            width: 65px;
            height: 65px;

            display: flex;
            align-items: center;
            justify-content: center;

            text-decoration: none;

            border-radius: 50%;

            transition: 0.2s ease;
        }

        .nav-item svg {
            width: 32px;
            height: 32px;

            fill: #b9bec7;

            stroke: #b9bec7;

            stroke-width: 1.5;
        }

        .nav-item.active {
            width: 82px;
            height: 82px;

            background: #d1d2d6;
        }

        .nav-item.active svg {
            fill: #ffffff;
            stroke: #ffffff;
        }

        .nav-item:hover {
            transform: scale(1.05);
        }


        /* =========================
           الجوال
        ========================= */

        @media (max-width: 600px) {

            .logo-area {
                padding-top: 35px;
                padding-bottom: 25px;
            }

            .shine {
                font-size: 2.5rem;
            }

            .video-area {
                padding-left: 12px;
                padding-right: 12px;
                padding-bottom: 125px;
            }

            .nav-buttons-box {
                min-height: 82px;
                border-radius: 32px;
                padding: 8px 18px;
            }

            .nav-item {
                width: 55px;
                height: 55px;
            }

            .nav-item.active {
                width: 70px;
                height: 70px;
            }

            .nav-item svg {
                width: 29px;
                height: 29px;
            }
        }
    </style>
</head>


<body class="nav-body">


    <!-- =========================
         UIVERSE
    ========================== -->

    <div class="logo-area">

        <div class="shine">
            UIVERSE
        </div>

    </div>



    <!-- =========================
         الفيديو
    ========================== -->

    <div class="video-area">

        <div class="video-box">

            <video
                controls
                playsinline
                preload="metadata">

                <!-- الفيديو الموجود في GitHub -->
                <source
                    src="https://raw.githubusercontent.com/ameerbashar100-web/tiktok-live-bot/main/video.mp4"
                    type="video/mp4">

                متصفحك لا يدعم تشغيل الفيديو.

            </video>

        </div>

    </div>



    <!-- =========================
         شريط التنقل
    ========================== -->

    <nav class="custom-nav-bar">

        <div class="nav-buttons-box">


            <!-- الملف الشخصي -->

            <a
                href="page3.html"
                title="الملف الشخصي"
                class="nav-item">

                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24">

                    <circle
                        cx="12"
                        cy="7"
                        r="4">
                    </circle>

                    <path
                        d="M4.2 21c.8-4.3 3.4-6.6 7.8-6.6s7 2.3 7.8 6.6z">
                    </path>

                </svg>

            </a>



            <!-- الصفحة الأولى -->

            <a
                href="page1.html"
                title="المنصب"
                class="nav-item platform-item">

                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24">

                    <path
                        d="M13.8 2.5 6.7 12h4.7l-1.1 9.5L17.3 11h-4.6z">
                    </path>

                </svg>

            </a>



            <!-- الصفحة الحالية -->

            <a
                href="page2.html"
                title="التوظيف"
                class="nav-item active">

                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24">

                    <path
                        d="M4 7.5h16A2 2 0 0 1 22 9.5v9A2 2 0 0 1 20 20.5H4a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2z">
                    </path>

                    <path
                        d="M8 7.5V5.8A1.8 1.8 0 0 1 9.8 4h4.4A1.8 1.8 0 0 1 16 5.8v1.7">
                    </path>

                    <path
                        d="M2 11.5h20">
                    </path>

                    <path
                        d="M10 11.5v2h4v-2">
                    </path>

                </svg>

            </a>


        </div>

    </nav>


</body>
</html>
