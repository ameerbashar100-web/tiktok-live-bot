<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة البث والشبكة</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .logo-area {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-top: 24px;
            padding-bottom: 22px;
        }

        .shine {
            font-size: 2.8em;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.3);
            background-image: linear-gradient(
                -40deg,
                transparent 0%,
                transparent 40%,
                #fff 50%,
                transparent 60%,
                transparent 100%
            );
            background-repeat: no-repeat;
            background-size: 80px 100%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: rgba(255, 255, 255, 0.3);
            animation: zezzz 5s infinite;
        }

        @keyframes zezzz {
            0%, 10% { background-position: -200px 0; }
            20% { background-position: top left; }
            100% { background-position: 200px 0; }
        }

        .video-area {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 0 15px 12px;
        }

        .video-area video {
            width: 100%;
            max-width: 700px;
            height: auto;
            display: block;
            border-radius: 15px;
            background: #111;
        }
    </style>
</head>

<body class="nav-body">

    <div class="logo-area">
        <div class="shine">UIVERSE</div>
    </div>

    <div class="video-area">
        <video controls playsinline preload="metadata">
            <source
                src="https://raw.githubusercontent.com/ameerbashar100-web/tiktok-live-bot/main/video.mp4"
                type="video/mp4">
            متصفحك لا يدعم تشغيل الفيديو.

    <!-- مربع البحث عن المستخدم - مضاف فقط أسفل الفيديو -->
    <section class="user-search-area" aria-label="البحث عن مستخدم">
        <div class="user-search-box">
            <div class="fire-line fire-line-one"></div>
            <div class="fire-line fire-line-two"></div>

            <div class="search-title">البحث عن مستخدم</div>

            <div class="search-input-wrap">
                <span class="search-icon">⌕</span>
                <input id="userSearchInput" type="search"
                       inputmode="numeric"
                       autocomplete="off"
                       placeholder="اكتب رقم المستخدم..."
                       aria-label="رقم المستخدم">
            </div>

            <div id="userResults" class="user-results" hidden></div>

            <div id="statusMessage" class="status-message" role="status" aria-live="polite"></div>

            <div id="myUserCard" class="my-user-card" hidden>
                <div class="my-user-main">
                    <div class="my-user-leader">
                        <span class="leader-id-wrap"><span id="leaderId">997327</span><span class="leader-avatar-inline"><img id="leaderAvatar" alt="" /></span></span>
                        <span class="my-user-role">قائد V3</span>
                    </div>
                    <div class="my-user-code">رمز المستخدم الخاص بك: <strong id="myUserId"></strong></div>
                </div>
                <div class="my-user-avatar"><img id="myUserAvatar" alt="" /></div>
            </div>


        </div>
    </section>

    <style>
        .user-search-area {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 0 12px 125px;
            box-sizing: border-box;
        }

        .user-search-box {
            position: relative;
            width: 100%;
            max-width: 620px;
            padding: 11px 11px 11px;
            border-radius: 22px;
            overflow: hidden;
            box-sizing: border-box;
            background:
                radial-gradient(circle at 50% -20%, rgba(255,255,255,.09), transparent 42%),
                linear-gradient(145deg, #151515, #080808);
            border: 1px solid rgba(255,255,255,.10);
            box-shadow: 0 16px 45px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,255,255,.05);
        }

        .user-search-box::before,
        .user-search-box::after {
            content: "";
            position: absolute;
            inset: -2px;
            pointer-events: none;
            border-radius: 24px;
            background: conic-gradient(
                from 0deg,
                transparent 0deg,
                transparent 35deg,
                rgba(255,77,0,.9) 55deg,
                rgba(255,176,0,.35) 75deg,
                transparent 100deg,
                transparent 185deg,
                rgba(255,54,0,.7) 215deg,
                transparent 255deg,
                transparent 360deg
            );
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            padding: 1px;
            animation: fireOrbit 3.8s linear infinite;
        }

        .user-search-box::after {
            filter: blur(7px);
            opacity: .42;
            animation-duration: 2.7s;
        }

        .fire-line {
            position: absolute;
            height: 2px;
            width: 130px;
            border-radius: 50%;
            background: linear-gradient(90deg, transparent, #ff3d00, #ffb000, transparent);
            filter: blur(.2px);
            opacity: .8;
            pointer-events: none;
        }

        .fire-line-one {
            top: 8px;
            right: 10%;
            animation: fireDash 2.4s ease-in-out infinite;
        }

        .fire-line-two {
            bottom: 8px;
            left: 8%;
            animation: fireDash 2.9s ease-in-out infinite reverse;
        }

        @keyframes fireOrbit {
            to { transform: rotate(360deg); }
        }

        @keyframes fireDash {
            0%, 100% { transform: translateX(0) scaleX(.55); opacity: .25; }
            50% { transform: translateX(55px) scaleX(1); opacity: 1; }
        }

        .search-title {
            position: relative;
            z-index: 2;
            margin-bottom: 7px;
            text-align: center;
            color: rgba(255,255,255,.88);
            font-size: 14px;
            font-weight: 850;
            letter-spacing: .3px;
        }

        .search-input-wrap {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            height: 40px;
            border-radius: 15px;
            background: rgba(255,255,255,.055);
            border: 1px solid rgba(255,255,255,.12);
            transition: .25s ease;
        }

        .search-input-wrap:focus-within {
            border-color: rgba(255,132,0,.7);
            box-shadow: 0 0 0 4px rgba(255,82,0,.08), 0 0 22px rgba(255,69,0,.14);
        }

        .search-icon {
            width: 40px;
            text-align: center;
            color: #ff9d00;
            font-size: 24px;
            line-height: 1;
            transform: rotate(-20deg);
            user-select: none;
        }

        #userSearchInput {
            width: 100%;
            height: 100%;
            border: 0;
            outline: 0;
            background: transparent;
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            padding: 0 12px 0 10px;
            box-sizing: border-box;
            direction: rtl;
        }

        #userSearchInput::placeholder {
            color: rgba(255,255,255,.38);
        }

        .user-results {
            position: relative;
            z-index: 4;
            margin-top: 7px;
            max-height: 145px;
            overflow-y: auto;
            border-radius: 15px;
            background: rgba(12,12,12,.98);
            border: 1px solid rgba(255,255,255,.09);
            box-shadow: 0 12px 30px rgba(0,0,0,.35);
        }

        .user-result {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            border: 0;
            border-bottom: 1px solid rgba(255,255,255,.055);
            background: transparent;
            color: #fff;
            padding: 9px 11px;
            cursor: pointer;
            text-align: right;
            font-size: 14px;
            transition: background .2s ease, transform .2s ease;
        }

        .user-result:last-child {
            border-bottom: 0;
        }

        .user-result:hover,
        .user-result:focus {
            outline: 0;
            background: rgba(255,78,0,.10);
            transform: translateX(-2px);
        }

        .user-result .user-number {
            font-weight: 900;
            letter-spacing: .6px;
            font-size: 14px;
        }

        .user-result .user-icon {
            opacity: 1;
            font-size: 17px;
            filter: drop-shadow(0 0 6px rgba(0,170,255,.75));
        }

        .user-result .user-icon::first-letter {
            color: #00b7ff;
        }

        .no-results {
            padding: 16px;
            text-align: center;
            color: rgba(255,255,255,.46);
            font-size: 13px;
        }

        .status-message {
            position: relative;
            z-index: 3;
            display: none;
            margin-top: 12px;
            padding: 12px 14px;
            border-radius: 13px;
            text-align: center;
            color: #fff;
            background: rgba(255,255,255,.055);
            border: 1px solid rgba(255,255,255,.10);
            font-size: 13px;
            font-weight: 800;
            animation: messageIn .35s ease both;
        }

        .status-message.request {
            border-color: rgba(255,107,0,.32);
            box-shadow: 0 0 18px rgba(255,70,0,.08);
        }

        .status-message.success {
            border-color: rgba(0,145,255,.35);
            box-shadow: 0 0 22px rgba(0,130,255,.12);
        }

        @keyframes messageIn {
            from { opacity: 0; transform: translateY(7px) scale(.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }









        @media (max-width: 420px) {
            .user-search-area {
                padding-left: 12px;
                padding-right: 12px;
            }

            .user-search-box {
                padding-left: 14px;
                padding-right: 14px;
            }
        }
    </style>

                    results.hidden = false;

                    const avatar = avatars[Math.abs(Number(userId)) % avatars.length];

                            <span class="user-number">${userId}</span>

                    `;
                    button.addEventListener('click', () => selectUser(userId));
                    results.appendChild(button);

                status.className = `status-message ${type}`;
                status.style.display = 'block';

                if (duration) {
                    status.hideTimer = window.setTimeout(() => {
                        status.style.display = 'none';

                }
            };

                window.clearTimeout(requestTimer);

                results.hidden = true;
                results.innerHTML = '';
                input.value = '';
