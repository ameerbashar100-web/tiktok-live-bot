<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة البث والشبكة</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .logo-area {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-top: 24px;
            padding-bottom: 22px;
        }

        .shine {
            font-size: 2.8em;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.3);
            background-image: linear-gradient(
                -40deg,
                transparent 0%,
                transparent 40%,
                #fff 50%,
                transparent 60%,
                transparent 100%
            );
            background-repeat: no-repeat;
            background-size: 80px 100%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: rgba(255, 255, 255, 0.3);
            animation: zezzz 5s infinite;
        }

        @keyframes zezzz {
            0%, 10% { background-position: -200px 0; }
            20% { background-position: top left; }
            100% { background-position: 200px 0; }
        }

        .video-area {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 0 15px 120px;
        }

        .video-area video {
            width: 100%;
            max-width: 700px;
            height: auto;
            display: block;
            border-radius: 15px;
            background: #111;
        }
    </style>
</head>

<body class="nav-body">

    <div class="logo-area">
        <div class="shine">UIVERSE</div>
    </div>
