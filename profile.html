<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1, viewport-fit=cover" />
  <title>GAT — ملفي الشخصي</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="center">
    <h2 style="text-align:center;margin-bottom:12px;color:var(--muted)">ملفي الشخصي</h2>

    <div class="deposit-wrapper">
      <div id="balanceCard" class="balance-card" role="button" tabindex="0" aria-pressed="false">
        <div class="balance-left">
          <div class="balance-label">الرصيد</div>
          <div class="balance-amount">00.00</div>
        </div>
        <div class="balance-right">
          <div class="status-dot" aria-hidden="true"></div>
        </div>
      </div>

      <form id="depositForm" class="deposit-form">
        <label>اختر الشبكة</label>
        <select id="networkSelect" class="input">
          <option value="TRC20">TRC20</option>
          <option value="ERC20">ERC20</option>
          <option value="BEP20">BEP20</option>
          <option value="SOL">SOL</option>
        </select>

        <label>عنوان المحفظة (TRC20)</label>
        <input id="walletAddr" class="input" placeholder="ادخل عنوان المحفظة TRC20" />

        <label>كلمة السر</label>
        <input id="walletPass" class="input" type="password" placeholder="كلمة السر" />

        <label>مبلغ الشحن</label>
        <input id="depositAmount" class="input" placeholder="مثال: 10.00" />

        <div class="actions-row">
          <button type="button" id="nixBtn" class="btn-nix">Nix</button>
        </div>
      </form>
    </div>

    <nav style="display:flex;gap:12px;justify-content:center;margin-top:18px">
      <a href="index.html" class="link">العودة إلى الرئيسية</a>
      <a href="packages.html" class="link">الباقات</a>
    </nav>
  </main>

  <script>
    document.getElementById('balanceCard').addEventListener('click', function(){
      this.classList.toggle('active');
      this.setAttribute('aria-pressed', this.classList.contains('active'));
    });

    document.getElementById('nixBtn').addEventListener('click', function(){
      alert('عذراً، رصيدك غير متاح');
    });
  </script>
</body>
</html>
