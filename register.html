<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>تسجيل - ACCE</title>
  <style>
    :root{
      --bg:#f3f7fb;
      --card:#ffffff;
      --accent:#1e88e5;
      --muted:#6b7280;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    }
    body{margin:0;background:linear-gradient(180deg,#eef6ff,#f7fbff);color:#0b1320}
    .wrap{max-width:420px;margin:18px auto;padding:12px}
    .brand{display:flex;align-items:center;gap:10px}
    .brand .logo{font-weight:800;color:var(--accent);font-size:28px}
    .brand .country{margin-left:auto}

    .hero{margin-top:8px;text-align:center}
    .hero h1{font-size:34px;margin:6px 0;text-shadow:0 6px 12px rgba(0,0,0,0.12)}
    .hero p{color:var(--muted);margin:6px 0}

    .card{background:var(--card);border-radius:14px;padding:16px;margin-top:14px;box-shadow:0 8px 24px rgba(11,32,64,0.06)}
    label{display:block;color:#0b3a66;font-weight:700;margin-bottom:6px}
    .field{display:flex;align-items:center;gap:8px;background:linear-gradient(180deg,#fff,#fbfdff);padding:10px;border-radius:10px;border:1px solid rgba(10,20,40,0.04);margin-bottom:12px}
    .field input{border:0;background:transparent;flex:1;font-size:15px;outline:none}
    .select-flag{display:flex;align-items:center;gap:6px;padding-right:6px}
    .eye{opacity:0.7}

    .captcha{display:flex;align-items:center;justify-content:space-between;background:#f8fbff;padding:12px;border-radius:10px;border:1px solid rgba(10,20,40,0.04);margin-bottom:12px}
    .captcha .box{background:#fff;padding:10px 14px;border-radius:8px;font-weight:700;color:#8b5cf6}

    .invite{display:flex;align-items:center;gap:8px}
    .invite input{flex:1}

    .btn{display:block;margin-top:10px;background:var(--accent);color:#fff;padding:12px;border-radius:10px;text-align:center;font-weight:800;text-decoration:none}

    .small{font-size:13px;color:var(--muted);margin-top:10px}
    .small a{color:var(--accent);text-decoration:none}

    @media (max-width:420px){.wrap{padding:8px}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <div class="logo">ACCE</div>
      <div class="country">🇦🇪 <span style="font-size:12px;color:var(--muted)">24</span></div>
    </div>

    <div class="hero">
      <h1>تسجيل المستخدم</h1>
      <p>للتسجيل تواصل خاص</p>
    </div>

    <div class="card" role="form">
      <label>رقم الهاتف</label>
      <div class="field">
        <div class="select-flag">+964 ▾</div>
        <input type="tel" placeholder="رقم الهاتف" aria-label="phone" />
      </div>

      <label>كلمة المرور</label>
      <div class="field">
        <input type="password" placeholder="أدخل كلمة السر" aria-label="password" />
        <div class="eye">👁️</div>
      </div>

      <label>تأكيد كلمة المرور</label>
      <div class="field">
        <input type="password" placeholder="الرجاء تأكيد كلمة المرور" aria-label="confirm-password" />
        <div class="eye">👁️</div>
      </div>

      <label>الكابتشا الرسومية</label>
      <div class="captcha">
        <div>أدخل رمز التحقق من الرسوم البيانية</div>
        <div class="box">hyv6</div>
      </div>

      <label>رمز الدعوة</label>
      <div class="field invite">
        <input type="text" placeholder="dk69kv" value="dk69kv" aria-label="invite" />
        <div style="opacity:0.6">✖</div>
      </div>

      <div style="margin-top:6px">
        <label style="font-weight:500;display:flex;align-items:center;gap:8px"><input type="checkbox" /> لقد قرأت وأوافق <a href="#">اتفاقية التسجيل</a></label>
      </div>

      <a class="btn" href="#">تسجيل</a>

      <div class="small">ملاحظة: رمز الدعوة الظاهر هو من المثال المرفق. يمكنك تغييره أو تركه فارغاً.</div>
    </div>
  </div>
</body>
</html>
