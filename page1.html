<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الصفحة الرئيسية</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;600;700;800&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            font-family: 'Cairo', 'Inter', sans-serif;
            min-height: 100vh;
        }

        /* حاوية الصفحة الرئيسية */
        .page-content {
            width: 100%;
            max-width: 520px;
            margin: 10px auto 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            padding: 0 12px;
        }

        /* --- البطاقة الداكنة (قيمة الرصيد) --- */
        .card-inner-body {
            width: 100%;
            max-width: 360px;
            background: #17161b;
            border-radius: 26px;
            padding: 24px 20px 20px;
            position: relative;
            overflow: hidden;
            min-height: 240px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* تأثير التوهج الخلفي للبطاقة */
        .moving-purple-glow {
            position: absolute;
            top: -10px;
            right: 10px;
            width: 180px;
            height: 120px;
            background: radial-gradient(circle, rgba(138, 60, 246, 0.85) 0%, rgba(138, 60, 246, 0) 70%);
            filter: blur(35px);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
            animation: moveGlow 6s ease-in-out infinite alternate;
        }

        @keyframes moveGlow {
            0% { transform: translate(0, 0) scale(1); opacity: 0.7; }
            50% { transform: translate(-25px, 15px) scale(1.2); opacity: 1; }
            100% { transform: translate(15px, 5px) scale(0.9); opacity: 0.8; }
        }

        /* حلقات الخلفية الثابتة */
        .bg-glow-1 {
            position: absolute; width: 260px; height: 260px;
            border: 1px solid rgba(138, 86, 255, 0.25); border-radius: 50%;
            top: -50px; right: -60px; pointer-events: none;
        }
        .bg-glow-2 {
            position: absolute; width: 220px; height: 220px;
            border: 1px solid rgba(138, 86, 255, 0.35); border-radius: 50%;
            bottom: -90px; left: -40px; pointer-events: none;
        }
        .bg-blob {
            position: absolute; bottom: -30px; left: -30px;
            width: 140px; height: 140px;
            background: radial-gradient(circle, rgba(123, 62, 247, 0.8) 0%, rgba(123, 62, 247, 0) 70%);
            filter: blur(20px); pointer-events: none;
        }

        /* الرصيد */
        .balance-title-val {
            direction: ltr; text-align: right;
            font-family: 'Inter', 'Cairo', sans-serif;
            font-size: 34px; font-weight: 800; color: #ffffff;
            letter-spacing: -0.5px; margin-bottom: 14px;
            position: relative; z-index: 2;
        }

        /* الشارات */
        .badges-row { display: flex; gap: 8px; flex-wrap: wrap; position: relative; z-index: 2; }
        .badge-item {
            background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 20px;
            padding: 6px 14px; font-size: 11px; color: #d1d1d6;
            display: flex; align-items: center; gap: 6px; font-weight: 800;
        }

        /* الجزء السفلي للبطاقة */
        .card-bottom-row { display: flex; justify-content: flex-start; align-items: flex-end; margin-top: 30px; position: relative; z-index: 2; }
        .maturity-tag { color: #d1d1d6; font-size: 13px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
        .lock-icon { width: 14px; height: 14px; fill: currentColor; }


        /* --- قائمة الإجراءات الجديدة (النمط الكلاسيكي) --- */
        .action-list-container {
            width: 100%;
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .action-list-item {
            display: flex;
            align-items: center;
            padding: 18px 16px;
            border-bottom: 1px solid #f0f0f0;
            text-decoration: none;
            color: #1a1a1a;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .action-list-item:last-child {
            border-bottom: none;
        }

        .action-list-item:hover {
            background-color: #f9f9f9;
        }

        .list-icon {
            width: 36px;
            height: 36px;
            margin-left: 14px; /* مسافة على اليسار لأن اللغة RTL */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .list-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .list-text {
            flex-grow: 1;
            font-size: 16px;
            font-weight: 600;
            color: #1a1a1a;
        }

        .list-arrow {
            color: #c7c7cc;
            font-size: 20px;
            font-weight: bold;
        }

    </style>
</head>
<body>

    <div class="page-content">

        <!-- البطاقة الداكنة (الرصيد) -->
        <div class="card-inner-body">
            <div class="moving-purple-glow"></div>
            <div class="bg-glow-1"></div>
            <div class="bg-glow-2"></div>
            <div class="bg-blob"></div>

            <div class="balance-title-val">$0.000</div>

            <div class="badges-row">
                <div class="badge-item"><span>🔍</span> min 7.4% APR</div>
                <div class="badge-item"><span>✧</span> earned +124.62</div>
            </div>

            <div class="card-bottom-row">
                <div class="maturity-tag">
                    maturity 100%
                    <svg class="lock-icon" viewBox="0 0 24 24">
                        <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-0.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                    </svg>
                </div>
            </div>
        </div>

        <!-- قائمة الإجراءات الجديدة (التي تحل محل المربعات) -->
        <div class="action-list-container">
            <!-- شحن الحساب -->
            <div class="action-list-item">
                <div class="list-icon">
                    <img src="deposit.png" alt="شحن الحساب">
                </div>
                <div class="list-text">شحن الحساب</div>
                <div class="list-arrow">›</div>
            </div>

            <!-- سحب -->
            <div class="action-list-item">
                <div class="list-icon">
                    <img src="withdraw.png" alt="سحب">
                </div>
                <div class="list-text">سحب</div>
                <div class="list-arrow">›</div>
            </div>

            <!-- توظيف الموظفين -->
            <div class="action-list-item">
                <div class="list-icon">
                    <img src="recruit.png" alt="توظيف الموظفين">
                </div>
                <div class="list-text">توظيف الموظفين</div>
                <div class="list-arrow">›</div>
            </div>

            <!-- عنوان المحفظة -->
            <div class="action-list-item">
                <div class="list-icon">
                    <img src="wallet_address.png" alt="عنوان المحفظة">
                </div>
                <div class="list-text">عنوان المحفظة</div>
                <div class="list-arrow">›</div>
            </div>
        </div>

    </div>

</body>
</html>
