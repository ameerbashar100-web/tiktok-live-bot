<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الصفحة الرئيسية</title>
    <link rel="stylesheet" href="style.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            font-family: 'Cairo', 'Inter', sans-serif;
            min-height: 100vh;
        }

        /* حاوية الصفحة - محاذاة من الأعلى مباشرة */
        .page-content {
            width: 100%;
            max-width: 520px;
            margin: 0 auto 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 0 12px;
        }

        /* --- البطاقة الداكنة العلويّة --- */
        .card-inner-body {
            width: 100%;
            max-width: 360px;
            background: #17161b;
            border-radius: 26px;
            padding: 18px 18px 14px;
            position: relative;
            overflow: hidden;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin-top: -15px; /* رفع بطاقة الرصيد للأعلى جداً */
        }

        /* خلفية بنفسجية ضبابية متحرّكة */
        .moving-purple-glow {
            position: absolute;
            top: -10px;
            right: 10px;
            width: 180px;
            height: 120px;
            background: radial-gradient(circle, rgba(138, 60, 246, 0.85) 0%, rgba(138, 60, 246, 0) 70%);
            filter: blur(35px);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
            animation: moveGlow 6s ease-in-out infinite alternate;
        }

        @keyframes moveGlow {
            0% { transform: translate(0, 0) scale(1); opacity: 0.7; }
            50% { transform: translate(-25px, 15px) scale(1.2); opacity: 1; }
            100% { transform: translate(15px, 5px) scale(0.9); opacity: 0.8; }
        }

        .bg-glow-1 {
            position: absolute;
            width: 260px;
            height: 260px;
            border: 1px solid rgba(138, 86, 255, 0.25);
            border-radius: 50%;
            top: -50px;
            right: -60px;
            pointer-events: none;
        }

        .bg-glow-2 {
            position: absolute;
            width: 220px;
            height: 220px;
            border: 1px solid rgba(138, 86, 255, 0.35);
            border-radius: 50%;
            bottom: -90px;
            left: -40px;
            pointer-events: none;
        }

        .bg-blob {
            position: absolute;
            bottom: -30px;
            left: -30px;
            width: 140px;
            height: 140px;
            background: radial-gradient(circle, rgba(123, 62, 247, 0.8) 0%, rgba(123, 62, 247, 0) 70%);
            filter: blur(20px);
            pointer-events: none;
        }

        .balance-title-val {
            direction: ltr;
            text-align: right;
            font-family: 'Inter', 'Cairo', sans-serif;
            font-size: 32px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            position: relative;
            z-index: 2;
        }

        .badges-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            position: relative;
            z-index: 2;
        }

        .badge-item {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 5px 12px;
            font-size: 11px;
            color: #d1d1d6;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 800;
        }

        .card-bottom-row {
            display: flex;
            justify-content: flex-start;
            align-items: flex-end;
            margin-top: 15px;
            position: relative;
            z-index: 2;
        }

        .maturity-tag {
            color: #d1d1d6;
            font-size: 12px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .lock-icon {
            width: 13px;
            height: 13px;
            fill: currentColor;
        }

        /* --- القائمة البيضاء السفليّة --- */
        .white-menu-box {
            width: 100%;
            max-width: 360px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .menu-item {
            width: 100%;
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            background: transparent;
            border: 0;
            border-bottom: 1px solid #f0f0f5;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s ease;
        }

        .menu-item:last-child {
            border-bottom: none;
        }

        .menu-item:hover {
            background: #f8f8fb;
        }

        .item-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .item-icon {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111115;
            color: #ffffff;
            border: 1px solid rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .menu-item:hover .item-icon {
            background: #000000;
            transform: scale(1.05);
        }

        .item-icon svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .item-text {
            font-size: 14px;
            font-weight: 700;
            color: #111115;
            font-family: 'Cairo', sans-serif;
        }

        .item-arrow {
            font-size: 15px;
            color: #111115;
            font-weight: bold;
        }

        /* --- تصميم الصورة الإعلانية السفلية --- */
        .bottom-banner-container {
            width: 100%;
            max-width: 360px;
            margin-top: 4px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .bottom-banner-container img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 16px;
            object-fit: cover;
        }

        /* --- النوافذ المنبثقة (Modals) --- */
        .modal {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 18px;
            background: rgba(0,0,0,.58);
            backdrop-filter: blur(12px);
        }

        .modal.show { display: flex; }

        .modal-box {
            width: 100%;
            max-width: 360px;
            background: #17161b;
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 23px;
            padding: 22px;
            box-shadow: 0 20px 60px rgba(0,0,0,.65);
            text-align: center;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 16px;
        }

        .modal-actions {
            display: flex;
            gap: 9px;
            margin-top: 15px;
        }

        .modal-actions button {
            flex: 1;
            height: 45px;
            border-radius: 13px;
            border: 0;
            font-family: 'Cairo', sans-serif;
            font-weight: 800;
            cursor: pointer;
        }

        .close-btn {
            background: #29282f;
            color: #fff;
        }

        .trc20-card {
            background: #0d0d10;
            border: 1px solid rgba(255,255,255,.09);
            border-radius: 17px;
            padding: 16px;
            text-align: left;
        }

        .trc20-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 15px;
        }

        .wallet-label {
            color: #aaaab3;
            font-size: 11px;
            font-weight: 800;
            margin-bottom: 7px;
        }

        .wallet-address {
            word-break: break-all;
            background: #17171c;
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 11px;
            padding: 12px;
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 700;
        }

        .copy-wallet {
            width: 100%;
            height: 43px;
            margin-top: 10px;
            border: 0;
            border-radius: 11px;
            background: #fff;
            color: #090909;
            font-family: 'Cairo', sans-serif;
            font-weight: 800;
            cursor: pointer;
        }

        .status-text {
            color: #bdbdc6;
            font-size: 14px;
            font-weight: 700;
            padding: 15px 0;
        }
    </style>
</head>

<body class="nav-body">

    <div class="page-content">

        <!-- البطاقة الداكنة (الرصيد) -->
        <div class="card-inner-body">
            <div class="moving-purple-glow"></div>
            <div class="bg-glow-1"></div>
            <div class="bg-glow-2"></div>
            <div class="bg-blob"></div>

            <div class="balance-title-val">$0.000</div>

            <div class="badges-row">
                <div class="badge-item"><span>🔍</span> min 7.4% APR</div>
                <div class="badge-item"><span>✧</span> earned +124.62</div>
            </div>

            <div class="card-bottom-row">
                <div class="maturity-tag">
                    maturity 100%
                    <svg class="lock-icon" viewBox="0 0 24 24">
                        <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-0.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                    </svg>
                </div>
            </div>
        </div>

        <!-- القائمة البيضاء السفليّة -->
        <div class="white-menu-box">
            
            <!-- 1. شحن الحساب -->
            <button class="menu-item" onclick="openModal('topupModal')">
                <div class="item-right">
                    <div class="item-icon">
                        <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                    </div>
                    <span class="item-text">شحن الحساب</span>
                </div>
                <span class="item-arrow">❮</span>
            </button>

            <!-- 2. سحب -->
            <button class="menu-item" onclick="openModal('withdrawModal')">
                <div class="item-right">
                    <div class="item-icon">
                        <svg viewBox="0 0 24 24"><path d="M5 13h14v-2H5v2zm0 4h14v-2H5v2zM5 9h14V7H5v2z"/></svg>
                    </div>
                    <span class="item-text">سحب</span>
                </div>
                <span class="item-arrow">❮</span>
            </button>

            <!-- 3. توظيف الموظفين -->
            <button class="menu-item" onclick="openModal('hireModal')">
                <div class="item-right">
                    <div class="item-icon">
                        <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                    </div>
                    <span class="item-text">توظيف الموظفين</span>
                </div>
                <span class="item-arrow">❮</span>
            </button>

            <!-- 4. عنوان المحفظة -->
            <button class="menu-item" onclick="openModal('walletModal')">
                <div class="item-right">
                    <div class="item-icon">
                        <svg viewBox="0 0 24 24"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
                    </div>
                    <span class="item-text">عنوان المحفظة</span>
                </div>
                <span class="item-arrow">❮</span>
            </button>

        </div>

        <!-- الصورة الإعلانية أسفل القائمة -->
        <div class="bottom-banner-container">
            <img src="banner.png" alt="الإعلان">
        </div>

    </div>

    <!-- النوافذ المنبثقة -->
    <div id="topupModal" class="modal" onclick="outsideClose(event, this)">
        <div class="modal-box">
            <div class="modal-title">شحن الحساب</div>
            <div class="trc20-card">
                <div class="trc20-brand"><span>USDT (TRC20)</span></div>
                <div class="wallet-label">عنوان الإيداع</div>
                <div class="wallet-address">THJN4XBKxbZNYsw7YAHmNiZSupn3kVEDFP</div>
                <button class="copy-wallet" onclick="alert('تم نسخ العنوان!')">نسخ العنوان</button>
            </div>
            <div class="modal-actions">
                <button class="close-btn" onclick="closeModal('topupModal')">إغلاق</button>
            </div>
        </div>
    </div>

    <div id="withdrawModal" class="modal" onclick="outsideClose(event, this)">
        <div class="modal-box">
            <div class="modal-title">سحب</div>
            <div class="status-text">أدخل تفاصيل السحب الخاصة بك.</div>
            <div class="modal-actions">
                <button class="close-btn" onclick="closeModal('withdrawModal')">إغلاق</button>
            </div>
        </div>
    </div>

    <div id="hireModal" class="modal" onclick="outsideClose(event, this)">
        <div class="modal-box">
            <div class="modal-title">توظيف الموظفين</div>
            <div class="status-text">لا يوجد موظفون متاحون حالياً.</div>
            <div class="modal-actions">
                <button class="close-btn" onclick="closeModal('hireModal')">إغلاق</button>
            </div>
        </div>
    </div>

    <div id="walletModal" class="modal" onclick="outsideClose(event, this)">
        <div class="modal-box">
            <div class="modal-title">عنوان المحفظة</div>
            <div class="status-text">عنوان المحفظة المسجل لديك هو TRC20.</div>
            <div class="modal-actions">
                <button class="close-btn" onclick="closeModal('walletModal')">إغلاق</button>
            </div>
        </div>
    </div>

    <script>
        function openModal(id) {
            document.getElementById(id).classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('show');
            document.body.style.overflow = '';
        }

        function outsideClose(event, modal) {
            if (event.target === modal) closeModal(modal.id);
        }
    </script>

    <script src="./bottom-nav.js"></script>
</body>
</html>
