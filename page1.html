<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الصفحة الرئيسية</title>
    <link rel="stylesheet" href="style.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;600;700;800&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            font-family: 'Cairo', 'Inter', sans-serif;
            min-height: 100vh;
        }

        /* حاوية البطاقة المثبتة في أعلى الشاشة */
        .page-content {
            width: 100%;
            display: flex;
            justify-content: center;
            position: fixed;
            top: 10px;
            left: 0;
            right: 0;
            z-index: 10;
            padding: 0 12px;
        }

        /* --- البطاقة الداكنة --- */
        .card-inner-body {
            width: 100%;
            max-width: 360px;
            background: #17161b;
            border-radius: 26px;
            padding: 24px 20px 20px;
            position: relative;
            overflow: hidden;
            min-height: 240px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* خلفية بنفسجية ضبابية متحرّكة خلف الأرقام */
        .moving-purple-glow {
            position: absolute;
            top: -10px;
            right: 10px;
            width: 180px;
            height: 120px;
            background: radial-gradient(circle, rgba(138, 60, 246, 0.85) 0%, rgba(138, 60, 246, 0) 70%);
            filter: blur(35px);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
            animation: moveGlow 6s ease-in-out infinite alternate;
        }

        @keyframes moveGlow {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 0.7;
            }
            50% {
                transform: translate(-25px, 15px) scale(1.2);
                opacity: 1;
            }
            100% {
                transform: translate(15px, 5px) scale(0.9);
                opacity: 0.8;
            }
        }

        /* الخلفيات المضيئة الثابتة */
        .bg-glow-1 {
            position: absolute;
            width: 260px;
            height: 260px;
            border: 1px solid rgba(138, 86, 255, 0.25);
            border-radius: 50%;
            top: -50px;
            right: -60px;
            pointer-events: none;
        }

        .bg-glow-2 {
            position: absolute;
            width: 220px;
            height: 220px;
            border: 1px solid rgba(138, 86, 255, 0.35);
            border-radius: 50%;
            bottom: -90px;
            left: -40px;
            pointer-events: none;
        }

        .bg-blob {
            position: absolute;
            bottom: -30px;
            left: -30px;
            width: 140px;
            height: 140px;
            background: radial-gradient(circle, rgba(123, 62, 247, 0.8) 0%, rgba(123, 62, 247, 0) 70%);
            filter: blur(20px);
            pointer-events: none;
        }

        /* الرصيد الرئيسي (الأرقام) فوق الضباب المتحرك */
        .balance-title-val {
            direction: ltr;
            text-align: right;
            font-family: 'Inter', 'Cairo', sans-serif;
            font-size: 34px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.5px;
            margin-bottom: 14px;
            position: relative;
            z-index: 2;
        }

        /* الشارات والتسميات (Badges) */
        .badges-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            position: relative;
            z-index: 2;
        }

        .badge-item {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 11px;
            color: #d1d1d6;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 800;
        }

        /* الجزء السفلي للبطاقة */
        .card-bottom-row {
            display: flex;
            justify-content: flex-start;
            align-items: flex-end;
            margin-top: 30px;
            position: relative;
            z-index: 2;
        }

        .maturity-tag {
            color: #d1d1d6;
            font-size: 13px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .lock-icon {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        /* --- أزرار البطاقة --- */
        .action-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 9px;
            margin-top: 18px;
            position: relative;
            z-index: 4;
        }

        .action-btn {
            min-height: 72px;
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 16px;
            background: rgba(255,255,255,.055);
            color: #fff;
            padding: 9px 5px;
            cursor: pointer;
            font-family: 'Inter', 'Cairo', sans-serif;
            font-weight: 800;
            font-size: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 6px;
            transition: .2s ease;
            backdrop-filter: blur(10px);
        }

        .action-btn:hover {
            transform: translateY(-2px);
            background: rgba(138,60,246,.18);
            border-color: rgba(138,60,246,.5);
        }

        .action-btn:active { transform: scale(.96); }

        .action-btn img {
            width: 27px;
            height: 27px;
            object-fit: contain;
        }

        /* المودالات والتغويش */
        .modal {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 18px;
            background: rgba(0,0,0,.58);
            backdrop-filter: blur(12px);
        }

        .modal.show { display: flex; }

        .modal-box {
            width: 100%;
            max-width: 360px;
            background: #17161b;
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 23px;
            padding: 22px;
            box-shadow: 0 20px 60px rgba(0,0,0,.65);
            text-align: center;
            animation: modalIn .18s ease-out;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: translateY(12px) scale(.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .modal-title {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 16px;
        }

        .field {
            text-align: left;
            margin-bottom: 12px;
        }

        .field label {
            display: block;
            font-size: 12px;
            font-weight: 800;
            margin-bottom: 7px;
            color: #d8d8df;
        }

        .field input {
            width: 100%;
            height: 48px;
            border-radius: 13px;
            border: 1px solid rgba(255,255,255,.1);
            outline: none;
            background: #0d0d10;
            color: #fff;
            padding: 0 13px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 700;
        }

        .usdt-input {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #0d0d10;
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 13px;
            padding: 0 11px;
        }

        .usdt-input input {
            border: 0;
            background: transparent;
            padding-left: 0;
        }

        .usdt-icon {
            width: 25px;
            height: 25px;
            object-fit: contain;
        }

        .modal-actions {
            display: flex;
            gap: 9px;
            margin-top: 15px;
        }

        .modal-actions button {
            flex: 1;
            height: 45px;
            border-radius: 13px;
            border: 0;
            font-family: 'Inter', 'Cairo', sans-serif;
            font-weight: 800;
            cursor: pointer;
        }

        .confirm-btn {
            background: #fff;
            color: #090909;
        }

        .close-btn {
            background: #29282f;
            color: #fff;
        }

        .status-text {
            color: #bdbdc6;
            font-size: 14px;
            font-weight: 800;
            line-height: 1.7;
            padding: 12px 0;
        }

        .event-image {
            width: 100%;
            height: 145px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 13px;
        }

        @media (max-width: 340px) {
            .action-grid { grid-template-columns: repeat(2, 1fr); }
        }

    </style>
</head>

<body class="nav-body">

    <div class="page-content">

        <!-- البطاقة الداكنة -->
        <div class="card-inner-body">
            <div class="moving-purple-glow"></div>
            <div class="bg-glow-1"></div>
            <div class="bg-glow-2"></div>
            <div class="bg-blob"></div>

            <div class="balance-title-val">$0.000</div>

            <div class="badges-row">
                <div class="badge-item"><span>🔍</span> min 7.4% APR</div>
                <div class="badge-item"><span>✧</span> earned +124.62</div>
            </div>

            <div class="card-bottom-row">
                <div class="maturity-tag">
                    maturity 100%
                    <svg class="lock-icon" viewBox="0 0 24 24">
                        <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-0.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                    </svg>
                </div>
            </div>

            <!-- أزرار البطاقة -->
            <div class="action-grid">
                <button class="action-btn" onclick="openModal('withdrawModal')">
                    <img src="withdraw.png" alt="Withdraw"><span>Withdraw</span>
                </button>
                <button class="action-btn" onclick="openModal('withdrawHistoryModal')">
                    <img src="withdraw-history.png" alt="Withdraw history"><span>Withdrawal History</span>
                </button>
                <button class="action-btn" onclick="openModal('purchaseHistoryModal')">
                    <img src="purchase-history.png" alt="Purchase history"><span>Purchase History</span>
                </button>
                <button class="action-btn" onclick="openModal('eventModal')">
                    <img src="event.png" alt="Event"><span>Event</span>
                </button>
                <button class="action-btn" onclick="openModal('tribeModal')">
                    <img src="tribe.png" alt="Tribe members"><span>Tribe Members</span>
                </button>
            </div>
        </div>

    </div>


    <!-- النوافذ -->
    <div id="withdrawModal" class="modal" onclick="outsideClose(event, this)">
        <div class="modal-box">
            <div class="modal-title">Withdraw</div>
            <div class="field">
                <label>TRC20 Wallet Address</label>
                <input id="walletAddress" type="text" placeholder="Enter TRC20 address">
            </div>
            <div class="field">
                <label>USDT</label>
                <div class="usdt-input">
                    <img class="usdt-icon" src="usdt.png" alt="USDT">
                    <input id="usdtAmount" type="number" min="0" step="any" placeholder="Enter amount">
                </div>
            </div>
            <div class="modal-actions">
                <button class="confirm-btn" onclick="tryWithdraw()">Nix</button>
                <button class="close-btn" onclick="closeModal('withdrawModal')">Close</button>
            </div>
        </div>
    </div>

    <div id="withdrawHistoryModal" class="modal" onclick="outsideClose(event, this)">
        <div class="modal-box">
            <div class="modal-title">Withdrawal History (0)</div>
            <div class="status-text">Activity history is not available.</div>
            <div class="modal-actions"><button class="close-btn" onclick="closeModal('withdrawHistoryModal')">Close</button></div>
        </div>
    </div>

    <div id="purchaseHistoryModal" class="modal" onclick="outsideClose(event, this)">
        <div class="modal-box">
            <div class="modal-title">Purchase History (0)</div>
            <div class="status-text">You have no purchase transactions.</div>
            <div class="modal-actions"><button class="close-btn" onclick="closeModal('purchaseHistoryModal')">Close</button></div>
        </div>
    </div>

    <div id="eventModal" class="modal" onclick="outsideClose(event, this)">
        <div class="modal-box">
            <div class="modal-title">Event</div>
            <img class="event-image" src="event-banner.png" alt="Event">
            <div class="status-text">Event information will appear here.</div>
            <div class="modal-actions"><button class="close-btn" onclick="closeModal('eventModal')">Close</button></div>
        </div>
    </div>

    <div id="tribeModal" class="modal" onclick="outsideClose(event, this)">
        <div class="modal-box">
            <div class="modal-title">Tribe Members</div>
            <div class="status-text">There are no members now.</div>
            <div class="modal-actions"><button class="close-btn" onclick="closeModal('tribeModal')">Close</button></div>
        </div>
    </div>

    <script>
        function openModal(id) {
            document.getElementById(id).classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('show');
            document.body.style.overflow = '';
        }

        function outsideClose(event, modal) {
            if (event.target === modal) closeModal(modal.id);
        }

        function tryWithdraw() {
            const wallet = document.getElementById('walletAddress').value.trim();
            const amount = document.getElementById('usdtAmount').value.trim();

            if (!wallet || !amount) {
                alert('Please enter the TRC20 wallet address and USDT amount.');
                return;
            }

            alert('USDT balance is not available ♈');
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                document.querySelectorAll('.modal.show').forEach(m => closeModal(m.id));
            }
        });
    </script>

    <script src="./bottom-nav.js"></script>
</body>
</html>
