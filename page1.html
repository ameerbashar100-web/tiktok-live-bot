<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الصفحة الرئيسية</title>
    <link rel="stylesheet" href="style.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap');

        .budget-card {
            width: min(92%, 430px);
            margin: 55px auto 30px;
            padding: 25px;
            box-sizing: border-box;
            border-radius: 28px;
            background: #202020;
            color: #fff;
            font-family: 'Cairo', sans-serif;
            box-shadow: 0 18px 45px rgba(0,0,0,.18);
        }

        .budget-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 18px;
        }

        .budget-title {
            margin: 0 0 3px;
            font-size: 14px;
            color: #bdbdbd;
        }

        .budget-number {
            margin: 0;
            font-size: 34px;
            line-height: 1.15;
            font-weight: 800;
            letter-spacing: .4px;
        }

        .budget-subtitle {
            margin: 5px 0 0;
            color: #a9a9a9;
            font-size: 13px;
        }

        .amount-box,
        .address-box {
            margin-top: 16px;
        }

        .field-label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            color: #c8c8c8;
        }

        .field {
            width: 100%;
            height: 54px;
            box-sizing: border-box;
            border: 1px solid rgba(255,255,255,.09);
            outline: none;
            border-radius: 16px;
            background: #2b2b2b;
            color: #fff;
            padding: 0 16px;
            font: 600 16px 'Cairo', sans-serif;
            transition: .2s ease;
        }

        .field:focus {
            border-color: #35a8ff;
            box-shadow: 0 0 0 3px rgba(53,168,255,.12);
        }

        .amount-summary {
            display: flex;
            justify-content: space-between;
            align-items: end;
            gap: 12px;
            margin-top: 10px;
        }

        .rate {
            color: #8e8e8e;
            font-size: 12px;
        }

        .available {
            text-align: left;
        }

        .available small {
            display: block;
            color: #999;
            font-size: 11px;
        }

        .available strong {
            font-size: 20px;
            color: #fff;
        }

        .action-btn {
            width: 100%;
            height: 58px;
            border: 0;
            border-radius: 17px;
            margin-top: 18px;
            color: #fff;
            font: 800 16px 'Cairo', sans-serif;
            cursor: pointer;
            transition: transform .18s ease, filter .18s ease, box-shadow .18s ease;
        }

        .action-btn:active {
            transform: scale(.98);
        }

        .blue-btn {
            background: linear-gradient(135deg, #159cff, #0878e8);
            box-shadow: 0 10px 25px rgba(8,120,232,.25);
        }

        .blue-btn:hover {
            filter: brightness(1.07);
        }

        .nix-btn {
            background: linear-gradient(135deg, #22c978, #0eaa5b);
            box-shadow: 0 10px 25px rgba(14,170,91,.22);
            margin-top: 12px;
        }

        .nix-btn:hover {
            filter: brightness(1.07);
        }

        /* طبقة الغواش */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            background: rgba(0,0,0,.28);
            backdrop-filter: blur(11px);
            -webkit-backdrop-filter: blur(11px);
        }

        .modal-backdrop.show {
            display: flex;
            animation: fadeIn .2s ease;
        }

        .modal-card {
            width: min(90%, 360px);
            padding: 25px 22px;
            box-sizing: border-box;
            border-radius: 24px;
            background: rgba(31,31,31,.94);
            border: 1px solid rgba(255,255,255,.09);
            box-shadow: 0 25px 70px rgba(0,0,0,.35);
            text-align: center;
            font-family: 'Cairo', sans-serif;
            color: #fff;
            animation: popIn .22s ease;
        }

        .modal-icon {
            width: 50px;
            height: 50px;
            margin: 0 auto 12px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: rgba(32,201,120,.13);
            color: #28d47f;
            font-size: 24px;
        }

        .modal-card h3 {
            margin: 0;
            font-size: 20px;
            font-weight: 800;
        }

        .modal-card p {
            margin: 8px 0 0;
            color: #bdbdbd;
            font-size: 13px;
            line-height: 1.8;
        }

        .modal-close {
            width: 100%;
            height: 46px;
            margin-top: 17px;
            border: 0;
            border-radius: 14px;
            background: #f3f3f3;
            color: #171717;
            font: 700 14px 'Cairo', sans-serif;
            cursor: pointer;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes popIn {
            from { opacity: 0; transform: translateY(8px) scale(.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
    </style>
</head>

<body class="nav-body">

    <div class="page-content">
        <div class="budget-card">
            <div class="budget-top">
                <div>
                    <p class="budget-title">الرصيد المتاح</p>
                    <h1 class="budget-number" id="availableTop">0.000</h1>
                    <p class="budget-subtitle">USDT</p>
                </div>
            </div>

            <div class="amount-box">
                <label class="field-label" for="usdtAmount">USDT</label>
                <input
                    class="field"
                    id="usdtAmount"
                    type="number"
                    inputmode="decimal"
                    min="0"
                    step="any"
                    placeholder="0.000"
                    autocomplete="off"
                >

                <div class="amount-summary">
                    <span class="rate">النسبة: 5.555%</span>
                    <div class="available">
                        <small>المتاح بعد النسبة</small>
                        <strong id="availableAmount">0.000 USDT</strong>
                    </div>
                </div>
            </div>

            <div class="address-box">
                <label class="field-label" for="trcAddress">عنوان شبكة TRC-20</label>
                <input
                    class="field"
                    id="trcAddress"
                    type="text"
                    placeholder="أدخل عنوان TRC-20"
                    autocomplete="off"
                >
            </div>

            <button class="action-btn blue-btn" type="button" id="viewMoreBtn">
                عرض المزيد
            </button>

            <button class="action-btn nix-btn" type="button" id="nixBtn">
                NiX
            </button>
        </div>
    </div>

    <div class="modal-backdrop" id="nixModal" aria-hidden="true">
        <div class="modal-card" role="dialog" aria-modal="true">
            <div class="modal-icon">♈</div>
            <h3>رصيدك غير متاح</h3>
            <p>لا يمكن إتمام العملية حاليًا، يرجى التحقق من الرصيد والمحاولة مرة أخرى.</p>
            <button class="modal-close" type="button" id="closeModal">إغلاق</button>
        </div>
    </div>

    <script>
        const amountInput = document.getElementById('usdtAmount');
        const availableAmount = document.getElementById('availableAmount');
        const availableTop = document.getElementById('availableTop');
        const nixBtn = document.getElementById('nixBtn');
        const nixModal = document.getElementById('nixModal');
        const closeModal = document.getElementById('closeModal');

        const RATE = 0.05555;

        function updateAmount() {
            const value = Number.parseFloat(amountInput.value);

            if (!Number.isFinite(value) || value < 0) {
                availableAmount.textContent = '0.000 USDT';
                availableTop.textContent = '0.000';
                return;
            }

            const available = Math.max(0, value - (value * RATE));
            const formatted = available.toFixed(3);

            availableAmount.textContent = formatted + ' USDT';
            availableTop.textContent = formatted;
        }

        amountInput.addEventListener('input', updateAmount);

        nixBtn.addEventListener('click', () => {
            nixModal.classList.add('show');
            nixModal.setAttribute('aria-hidden', 'false');
        });

        function hideModal() {
            nixModal.classList.remove('show');
            nixModal.setAttribute('aria-hidden', 'true');
        }

        closeModal.addEventListener('click', hideModal);

        nixModal.addEventListener('click', (event) => {
            if (event.target === nixModal) hideModal();
        });

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') hideModal();
        });
    </script>

    <script src="./bottom-nav.js"></script>
</body>
</html>
