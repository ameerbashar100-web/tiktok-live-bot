<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الصفحة الرئيسية</title>
    <link rel="stylesheet" href="style.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121318;
            color: #ffffff;
            font-family: 'Cairo', sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px 12px;
        }

        /* --- كارت التداول الاحترافي الرئيسي --- */
        .trade-dashboard-card {
            width: 100%;
            max-width: 400px;
            background: linear-gradient(145deg, #1e2029, #161820);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 22px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
        }

        /* الهيدر: الشبكة والعملة */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .network-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(235, 0, 27, 0.1);
            border: 1px solid rgba(235, 0, 27, 0.25);
            padding: 6px 12px;
            border-radius: 30px;
        }

        .network-icon {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            object-fit: cover;
        }

        .network-text {
            color: #ff4d4d;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background-color: #21c977;
            border-radius: 50%;
            box-shadow: 0 0 8px #21c977;
        }

        /* قسم عرض الرصيد */
        .balance-section {
            text-align: right;
            margin-bottom: 22px;
        }

        .balance-label {
            color: #8f96a3;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .balance-amount-wrapper {
            display: flex;
            align-items: baseline;
            gap: 8px;
            direction: ltr;
            justify-content: flex-end;
        }

        .balance-amount {
            font-size: 36px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.5px;
            line-height: 1;
        }

        .balance-currency {
            color: #3da9ff;
            font-size: 15px;
            font-weight: 700;
        }

        /* زر الإجراء الرئيسي */
        .action-btn {
            width: 100%;
            height: 46px;
            border: 0;
            border-radius: 14px;
            font: 700 14px 'Cairo', sans-serif;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .blue-btn {
            background: #ffffff;
            color: #111111;
            box-shadow: 0 4px 18px rgba(255, 255, 255, 0.12);
        }

        .blue-btn:hover {
            background: #e6e6e6;
            transform: translateY(-1px);
        }

        .blue-btn:active {
            transform: scale(0.98);
        }

        /* --- النوافذ المنبثقة (المودال) الاحتفاظ بكل الخصائص --- */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .modal-backdrop.show {
            display: flex;
            animation: fadeIn 0.18s ease;
        }

        .modal-card {
            width: min(90%, 320px);
            max-height: 82vh;
            overflow: auto;
            padding: 20px;
            box-sizing: border-box;
            border-radius: 20px;
            background: #1a1c23;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            text-align: right;
            font-family: 'Cairo', sans-serif;
            color: #fff;
            animation: popIn 0.2s ease;
        }

        .modal-title {
            margin: 0 0 14px;
            font-size: 16px;
            font-weight: 800;
        }

        .field-group { margin-top: 12px; }

        .field-label {
            display: block;
            margin-bottom: 6px;
            font-size: 11px;
            color: #a0a5b1;
        }

        .field {
            width: 100%;
            height: 44px;
            box-sizing: border-box;
            border: 1px solid rgba(255, 255, 255, 0.1);
            outline: none;
            border-radius: 12px;
            background: #242731;
            color: #fff;
            padding: 0 12px;
            font: 600 13px 'Cairo', sans-serif;
            direction: rtl;
        }

        .field:focus {
            border-color: #3da9ff;
            box-shadow: 0 0 0 2px rgba(61, 169, 255, 0.15);
        }

        .amount-summary {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 8px;
            gap: 8px;
        }

        .rate { color: #787e8c; font-size: 11px; }

        .available { font-size: 11px; color: #a0a5b1; }

        .available strong { color: #fff; font-size: 13px; }

        .nix-btn {
            background: linear-gradient(135deg, #21c977, #0eaa5b);
            color: #fff;
            margin-top: 14px;
            box-shadow: 0 6px 18px rgba(14, 170, 91, 0.25);
        }

        .close-btn {
            margin-top: 8px;
            height: 40px;
            background: rgba(255, 255, 255, 0.08);
            color: #ccc;
            font-size: 12px;
        }

        .close-btn:hover { background: rgba(255, 255, 255, 0.15); color: #fff; }

        .modal-icon {
            width: 42px;
            height: 42px;
            margin: 0 auto 10px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: rgba(32, 201, 120, 0.12);
            color: #28d47f;
            font-size: 20px;
        }

        .nix-modal .modal-card {
            width: min(85%, 280px);
            text-align: center;
        }

        .nix-modal h3 { margin: 0; font-size: 16px; }

        .nix-modal p {
            margin: 6px 0 0;
            color: #9096a2;
            font-size: 12px;
            line-height: 1.6;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes popIn {
            from { opacity: 0; transform: scale(.95) translateY(8px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
    </style>
</head>

<body class="nav-body">

    <div class="page-content" style="width: 100%; display: flex; justify-content: center;">

        <!-- مربع التداول الاحترافي الجديد -->
        <div class="trade-dashboard-card">
            <div class="card-header">
                <!-- شارة TRC20 مع الشعار حقيقي -->
                <div class="network-badge">
                    <img src="https://cryptologos.cc/logos/tron-trx-logo.svg?v=032" alt="TRC20" class="network-icon">
                    <span class="network-text">TRC-20 Network</span>
                </div>
                <div class="status-dot"></div>
            </div>

            <div class="balance-section">
                <p class="balance-label">الرصيد المتاح للتداول</p>
                <div class="balance-amount-wrapper">
                    <span class="balance-currency">USDT</span>
                    <span class="balance-amount" id="availableTop">0.000</span>
                </div>
            </div>

            <button class="action-btn blue-btn" type="button" id="viewMoreBtn">
                View More
            </button>
        </div>

    </div>

    <!-- التفاصيل (المودال) -->
    <div class="modal-backdrop" id="detailsModal" aria-hidden="true">
        <div class="modal-card" role="dialog" aria-modal="true">
            <h3 class="modal-title">تفاصيل الرصيد</h3>

            <div class="field-group">
                <label class="field-label" for="usdtAmount">USDT</label>
                <input class="field" id="usdtAmount" type="number"
                       inputmode="decimal" min="0" step="any"
                       placeholder="0.000" autocomplete="off">

                <div class="amount-summary">
                    <span class="rate">النسبة: 5.555%</span>
                    <span class="available">
                        المتاح:
                        <strong id="availableAmount">0.000 USDT</strong>
                    </span>
                </div>
            </div>

            <div class="field-group">
                <label class="field-label" for="trcAddress">عنوان شبكة TRC-20</label>
                <input class="field" id="trcAddress" type="text"
                       placeholder="أدخل عنوان TRC-20" autocomplete="off">
            </div>

            <button class="action-btn nix-btn" type="button" id="nixBtn">NiX</button>
            <button class="action-btn close-btn" type="button" id="closeDetails">إغلاق</button>
        </div>
    </div>

    <!-- نافذة NiX -->
    <div class="modal-backdrop nix-modal" id="nixModal" aria-hidden="true">
        <div class="modal-card" role="dialog" aria-modal="true">
            <!-- الأيقونة نفسها بدون تغيير -->
            <div class="modal-icon">♈</div>
            <h3>رصيدك غير متاح</h3>
            <p>لا يمكن إتمام العملية حاليًا.</p>
            <button class="action-btn close-btn" type="button" id="closeNix">إغلاق</button>
        </div>
    </div>

    <!-- البرمجة والأيقونات كما هي بدون أي تغيير -->
    <script>
        const amountInput = document.getElementById('usdtAmount');
        const availableAmount = document.getElementById('availableAmount');
        const availableTop = document.getElementById('availableTop');

        const viewMoreBtn = document.getElementById('viewMoreBtn');
        const detailsModal = document.getElementById('detailsModal');
        const closeDetails = document.getElementById('closeDetails');

        const nixBtn = document.getElementById('nixBtn');
        const nixModal = document.getElementById('nixModal');
        const closeNix = document.getElementById('closeNix');

        const RATE = 0.05555;

        function updateAmount() {
            const value = Number.parseFloat(amountInput.value);

            if (!Number.isFinite(value) || value < 0) {
                availableAmount.textContent = '0.000 USDT';
                availableTop.textContent = '0.000';
                return;
            }

            const available = Math.max(0, value - (value * RATE));
            const formatted = available.toFixed(3);

            availableAmount.textContent = formatted + ' USDT';
            availableTop.textContent = formatted;
        }

        amountInput.addEventListener('input', updateAmount);

        viewMoreBtn.addEventListener('click', () => {
            detailsModal.classList.add('show');
            detailsModal.setAttribute('aria-hidden', 'false');
        });

        closeDetails.addEventListener('click', () => {
            detailsModal.classList.remove('show');
            detailsModal.setAttribute('aria-hidden', 'true');
        });

        nixBtn.addEventListener('click', () => {
            nixModal.classList.add('show');
            nixModal.setAttribute('aria-hidden', 'false');
        });

        closeNix.addEventListener('click', () => {
            nixModal.classList.remove('show');
            nixModal.setAttribute('aria-hidden', 'true');
        });

        [detailsModal, nixModal].forEach(modal => {
            modal.addEventListener('click', event => {
                if (event.target === modal) {
                    modal.classList.remove('show');
                    modal.setAttribute('aria-hidden', 'true');
                }
            });
        });

        document.addEventListener('keydown', event => {
            if (event.key === 'Escape') {
                detailsModal.classList.remove('show');
                nixModal.classList.remove('show');
            }
        });
    </script>

    <script src="./bottom-nav.js"></script>
</body>
</html>
