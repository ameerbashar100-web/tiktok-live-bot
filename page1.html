<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الصفحة الرئيسية</title>
    <link rel="stylesheet" href="style.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;600;700;800&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            font-family: 'Cairo', 'Inter', sans-serif;
            min-height: 100vh;
        }

        /* حاوية البطاقة مثبتة في أعلى الشاشة مباشرة */
        .page-content {
            width: 100%;
            display: flex;
            justify-content: center;
            position: fixed;
            top: 10px;
            left: 0;
            right: 0;
            z-index: 10;
            padding: 0 12px;
        }

        /* --- تصميم البطاقة البنفسجية --- */
        .purple-card-container {
            width: 100%;
            max-width: 360px;
            background: #733bf6;
            border-radius: 32px;
            padding: 8px;
            box-shadow: 0 20px 50px rgba(115, 59, 246, 0.25);
            overflow: hidden;
            position: relative;
            cursor: pointer; /* جعل البطاقة بالكامل قابلة للنقر */
        }

        /* الشريط المتحرك العلوي */
        .ticker-bar {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            padding: 6px 0 10px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 13px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
        }

        .ticker-track {
            display: inline-block;
            animation: marquee 12s linear infinite;
        }

        .ticker-item {
            display: inline-block;
            margin: 0 12px;
        }

        @keyframes marquee {
            0% { transform: translateX(0%); }
            100% { transform: translateX(-50%); }
        }

        /* المربع الداخلي الداكن */
        .card-inner-body {
            background: #17161b;
            border-radius: 26px;
            padding: 24px 20px 20px;
            position: relative;
            overflow: hidden;
            min-height: 240px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* الأشكال والدوائر المضيئة في الخلفية */
        .bg-glow-1 {
            position: absolute;
            width: 260px;
            height: 260px;
            border: 1px solid rgba(138, 86, 255, 0.25);
            border-radius: 50%;
            top: -50px;
            right: -60px;
            pointer-events: none;
        }

        .bg-glow-2 {
            position: absolute;
            width: 220px;
            height: 220px;
            border: 1px solid rgba(138, 86, 255, 0.35);
            border-radius: 50%;
            bottom: -90px;
            left: -40px;
            pointer-events: none;
        }

        .bg-blob {
            position: absolute;
            bottom: -30px;
            left: -30px;
            width: 140px;
            height: 140px;
            background: radial-gradient(circle, rgba(123, 62, 247, 0.8) 0%, rgba(123, 62, 247, 0) 70%);
            filter: blur(20px);
            pointer-events: none;
        }

        /* الرصيد الرئيسي */
        .balance-title-val {
            direction: ltr;
            text-align: right;
            font-family: 'Inter', 'Cairo', sans-serif;
            font-size: 34px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.5px;
            margin-bottom: 14px;
            position: relative;
            z-index: 2;
        }

        /* الشارات والتسميات (Badges) */
        .badges-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            position: relative;
            z-index: 2;
        }

        .badge-item {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 11px;
            color: #d1d1d6;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
        }

        /* الجزء السفلي للبطاقة */
        .card-bottom-row {
            display: flex;
            justify-content: flex-start;
            align-items: flex-end;
            margin-top: 30px;
            position: relative;
            z-index: 2;
        }

        .maturity-tag {
            color: #d1d1d6;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .lock-icon {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        /* --- النوافذ المنبثقة (المودال) --- */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .modal-backdrop.show {
            display: flex;
            animation: fadeIn 0.18s ease;
        }

        .modal-card {
            width: min(90%, 320px);
            max-height: 82vh;
            overflow: auto;
            padding: 20px;
            box-sizing: border-box;
            border-radius: 20px;
            background: #1a1c23;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            text-align: right;
            font-family: 'Cairo', sans-serif;
            color: #fff;
            animation: popIn 0.2s ease;
        }

        .modal-title {
            margin: 0 0 14px;
            font-size: 16px;
            font-weight: 800;
        }

        .field-group { margin-top: 12px; }

        .field-label {
            display: block;
            margin-bottom: 6px;
            font-size: 11px;
            color: #a0a5b1;
        }

        .field {
            width: 100%;
            height: 44px;
            box-sizing: border-box;
            border: 1px solid rgba(255, 255, 255, 0.1);
            outline: none;
            border-radius: 12px;
            background: #242731;
            color: #fff;
            padding: 0 12px;
            font: 600 13px 'Cairo', sans-serif;
            direction: rtl;
        }

        .field:focus {
            border-color: #8a56ff;
            box-shadow: 0 0 0 2px rgba(138, 86, 255, 0.2);
        }

        .amount-summary {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 8px;
            gap: 8px;
        }

        .rate { color: #787e8c; font-size: 11px; }
        .available { font-size: 11px; color: #a0a5b1; }
        .available strong { color: #fff; font-size: 13px; }

        .action-btn {
            width: 100%;
            height: 44px;
            border: 0;
            border-radius: 12px;
            font: 700 13px 'Cairo', sans-serif;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nix-btn {
            background: linear-gradient(135deg, #8a56ff, #6323ec);
            color: #fff;
            margin-top: 14px;
            box-shadow: 0 6px 18px rgba(138, 86, 255, 0.3);
        }

        .close-btn {
            margin-top: 8px;
            height: 40px;
            background: rgba(255, 255, 255, 0.08);
            color: #ccc;
            font-size: 12px;
        }

        .modal-icon {
            width: 42px;
            height: 42px;
            margin: 0 auto 10px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: rgba(138, 86, 255, 0.15);
            color: #8a56ff;
            font-size: 20px;
        }

        .nix-modal .modal-card {
            width: min(85%, 280px);
            text-align: center;
        }

        .nix-modal h3 { margin: 0; font-size: 16px; }
        .nix-modal p { margin: 6px 0 0; color: #9096a2; font-size: 12px; line-height: 1.6; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes popIn {
            from { opacity: 0; transform: scale(.95) translateY(8px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
    </style>
</head>

<body class="nav-body">

    <div class="page-content">

        <!-- البطاقة البنفسجية في أعلى الشاشة كلياً -->
        <div class="purple-card-container" id="viewMoreBtn">
            <!-- الشريط المتحرك العلوي -->
            <div class="ticker-bar">
                <div class="ticker-track">
                    <span class="ticker-item">Unlock your tokens now!</span>
                    <span class="ticker-item">Unlock your tokens now!</span>
                    <span class="ticker-item">Unlock your tokens now!</span>
                    <span class="ticker-item">Unlock your tokens now!</span>
                </div>
            </div>

            <!-- جسم البطاقة الداخلي -->
            <div class="card-inner-body">
                <div class="bg-glow-1"></div>
                <div class="bg-glow-2"></div>
                <div class="bg-blob"></div>

                <!-- الرصيد المباشر -->
                <div class="balance-title-val">
                    $<span id="availableTop">0.000</span>
                </div>

                <!-- الشارات -->
                <div class="badges-row">
                    <div class="badge-item">
                        <span>✧</span> earned +124.62
                    </div>
                    <div class="badge-item">
                        <span>🔍</span> min 7.4% APR
                    </div>
                </div>

                <!-- الجزء السفلي للبطاقة -->
                <div class="card-bottom-row">
                    <div class="maturity-tag">
                        <svg class="lock-icon" viewBox="0 0 24 24">
                            <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                        </svg>
                        maturity 100%
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- نافذة التفاصيل (المودال) -->
    <div class="modal-backdrop" id="detailsModal" aria-hidden="true">
        <div class="modal-card" role="dialog" aria-modal="true">
            <h3 class="modal-title">تفاصيل الرصيد</h3>

            <div class="field-group">
                <label class="field-label" for="usdtAmount">USDT</label>
                <input class="field" id="usdtAmount" type="number"
                       inputmode="decimal" min="0" step="any"
                       placeholder="0.000" autocomplete="off">

                <div class="amount-summary">
                    <span class="rate">النسبة: 5.555%</span>
                    <span class="available">
                        المتاح:
                        <strong id="availableAmount">0.000 USDT</strong>
                    </span>
                </div>
            </div>

            <!-- تم تغيير اسم الزر من NiX إلى سحب -->
            <button class="action-btn nix-btn" type="button" id="nixBtn">سحب</button>
            <button class="action-btn close-btn" type="button" id="closeDetails">إغلاق</button>
        </div>
    </div>

    <!-- نافذة السحب -->
    <div class="modal-backdrop nix-modal" id="nixModal" aria-hidden="true">
        <div class="modal-card" role="dialog" aria-modal="true">
            <div class="modal-icon">♈</div>
            <h3>رصيدك غير متاح</h3>
            <p>لا يمكن إتمام العملية حاليًا.</p>
            <button class="action-btn close-btn" type="button" id="closeNix">إغلاق</button>
        </div>
    </div>

    <script>
        const amountInput = document.getElementById('usdtAmount');
        const availableAmount = document.getElementById('availableAmount');
        const availableTop = document.getElementById('availableTop');

        const viewMoreBtn = document.getElementById('viewMoreBtn');
        const detailsModal = document.getElementById('detailsModal');
        const closeDetails = document.getElementById('closeDetails');

        const nixBtn = document.getElementById('nixBtn');
        const nixModal = document.getElementById('nixModal');
        const closeNix = document.getElementById('closeNix');

        const RATE = 0.05555;

        function updateAmount() {
            const value = Number.parseFloat(amountInput.value);

            if (!Number.isFinite(value) || value < 0) {
                availableAmount.textContent = '0.000 USDT';
                availableTop.textContent = '0.000';
                return;
            }

            const available = Math.max(0, value - (value * RATE));
            const formatted = available.toFixed(3);

            availableAmount.textContent = formatted + ' USDT';
            availableTop.textContent = formatted;
        }

        amountInput.addEventListener('input', updateAmount);

        viewMoreBtn.addEventListener('click', () => {
            detailsModal.classList.add('show');
            detailsModal.setAttribute('aria-hidden', 'false');
        });

        closeDetails.addEventListener('click', () => {
            detailsModal.classList.remove('show');
            detailsModal.setAttribute('aria-hidden', 'true');
        });

        nixBtn.addEventListener('click', () => {
            nixModal.classList.add('show');
            nixModal.setAttribute('aria-hidden', 'false');
        });

        closeNix.addEventListener('click', () => {
            nixModal.classList.remove('show');
            nixModal.setAttribute('aria-hidden', 'true');
        });

        [detailsModal, nixModal].forEach(modal => {
            modal.addEventListener('click', event => {
                if (event.target === modal) {
                    modal.classList.remove('show');
                    modal.setAttribute('aria-hidden', 'true');
                }
            });
        });

        document.addEventListener('keydown', event => {
            if (event.key === 'Escape') {
                detailsModal.classList.remove('show');
                nixModal.classList.remove('show');
            }
        });
    </script>

    <script src="./bottom-nav.js"></script>
</body>
</html>
