<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ACCE — الصفحة الرئيسية</title>
  <link href="/index.html" rel="prefetch" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#eef6fb;--muted:#6b7280;--accent:#0b63c5}
    body{margin:0;font-family:'Cairo',sans-serif;background:linear-gradient(180deg,#f4f8fb,#eef6fb);color:#07102a}
    .wrap{max-width:920px;margin:20px auto;padding:18px}
    .user-card{display:flex;align-items:center;gap:12px;background:#fff;padding:12px;border-radius:12px;box-shadow:0 8px 24px rgba(2,6,23,0.06)}
    .avatar{width:56px;height:56px;border-radius:50%;background:linear-gradient(180deg,#fff,#f0f6ff);display:flex;align-items:center;justify-content:center;font-size:26px}
    .user-info{display:flex;flex-direction:column}
    .user-name{font-weight:800;font-size:18px}
    .user-sub{color:var(--muted);font-size:13px}

    .nav-bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;width:420px;max-width:96%;background:linear-gradient(180deg,#0b1220,#243246);color:#fff;border-radius:14px;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:6px;box-shadow:0 12px 40px rgba(2,6,23,0.28)}
    .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px;text-decoration:none;color:inherit}
    .nav-item .label{font-size:12px}
    .center-btn{background:linear-gradient(90deg,#2b82f6,#0b63c5);width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-top:-24px}
  </style>
</head>
<body>
  <div class="wrap">
    <div id="userBox" class="user-card"><div class="avatar">👤</div><div class="user-info"><div id="userName" class="user-name"></div><div class="user-sub">مرحباً بك في ACCE</div></div></div>
    <h2 style="margin-top:28px;color:#0b3a66">الصفحة الرئيسية</h2>
    <p style="color:var(--muted)">محتوى الصفحة الرئيسية — هنا يمكنك إضافة البطاقات والمحتوى الذي تريده.</p>
  </div>

  <nav class="nav-bottom" role="navigation">
    <a class="nav-item" href="/pages/home.html"><svg viewBox="0 0 24 24" width="28" height="28" fill="none"><path d="M3 11.5L12 4l9 7.5" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="label">الرئيسية</div></a>
    <a class="nav-item" href="/pages/hiring.html"><svg viewBox="0 0 24 24" width="28" height="28" fill="none"><path d="M4 4h16v6H4zM4 14h10v6H4z" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="label">التوظيف</div></a>
    <a class="nav-item" href="/pages/position.html"><div class="center-btn"><svg viewBox="0 0 24 24" width="24" height="24" fill="none"><path d="M12 2v20" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="label">المنصب</div></a>
    <a class="nav-item" href="/pages/records.html"><svg viewBox="0 0 24 24" width="28" height="28" fill="none"><path d="M3 7h18M3 12h18M3 17h18" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="label">السجل</div></a>
    <a class="nav-item" href="/pages/profile.html"><svg viewBox="0 0 24 24" width="28" height="28" fill="none"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zM3 20a9 9 0 0 1 18 0" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="label">المركز الشخصي</div></a>
  </nav>

  <script>
    // show stored user (from localStorage)
    const user = localStorage.getItem('acce_user') || '';
    document.getElementById('userName').textContent = user || 'مستخدم جديد';
  </script>
</body>
</html>
