<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ACCE — الصفحة الرئيسية</title>
  <link href="/index.html" rel="prefetch" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#eef6fb;--muted:#6b7280;--accent:#0b63c5}
    body{margin:0;font-family:'Cairo',sans-serif;background:linear-gradient(180deg,#f4f8fb,#eef6fb);color:#07102a}
    .wrap{max-width:920px;margin:20px auto;padding:18px}
    .user-card{display:flex;align-items:center;gap:12px;background:#fff;padding:12px;border-radius:12px;box-shadow:0 8px 24px rgba(2,6,23,0.06)}
    .avatar{width:56px;height:56px;border-radius:50%;background:linear-gradient(180deg,#fff,#f0f6ff);display:flex;align-items:center;justify-content:center;font-size:26px}
    .user-info{display:flex;flex-direction:column}
    .user-name{font-weight:800;font-size:18px}
    .user-sub{color:var(--muted);font-size:13px}

    /* Bottom navigation styling (icons like the provided image)
       Now pinned to the very bottom (safe-area aware) and centered. */
    .nav-bottom{position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom,12px);display:flex;justify-content:center;pointer-events:auto;z-index:999}
    .nav-bar{width:420px;max-width:96%;background:linear-gradient(180deg,#0b1220,#243246);color:#fff;border-radius:14px;padding:12px 14px;display:flex;gap:6px;align-items:center;justify-content:space-between;box-shadow:0 12px 30px rgba(2,6,23,0.4)}
    .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 4px;text-decoration:none;color:inherit;font-weight:700;font-size:14px}
    .nav-item .label{font-size:13px}
    .nav-item svg{width:28px;height:28px}
    .nav-item svg path, .nav-item svg circle, .nav-item svg rect{stroke:#fff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;fill:none}

    /* center button */
    .center-btn{background:linear-gradient(90deg,#2b82f6,#0b63c5);width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-top:-28px;box-shadow:0 10px 30px rgba(11,32,64,0.45);border:4px solid rgba(255,255,255,0.06)}
    .center-btn svg{width:30px;height:30px}
    .center-btn svg path{fill:#fff;stroke:none}

    /* make labels and icons centered and compact on small screens */
    @media (max-width:440px){
      .nav-bar{width:96%;padding:10px}
      .center-btn{width:56px;height:56px;margin-top:-22px}
      .nav-item .label{font-size:12px}
      .nav-item svg{width:24px;height:24px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="userBox" class="user-card"><div class="avatar">👤</div><div class="user-info"><div id="userName" class="user-name"></div><div class="user-sub">مرحباً بك في ACCE</div></div></div>
    <h2 style="margin-top:28px;color:#0b3a66">الصفحة الرئيسية</h2>
    <p style="color:var(--muted)">محتوى الصفحة الرئيسية — هنا يمكنك إضافة البطاقات والمحتوى الذي تريده.</p>
  </div>

  <!-- pinned bottom navigation (safe-area aware) -->
  <nav class="nav-bottom" role="navigation" aria-label="شريط التنقل السفلي">
    <div class="nav-bar">
      <!-- order left-to-right in markup, RTL page will visually place them right-to-left -->
      <a class="nav-item" href="/pages/profile.html" aria-label="المركز الشخصي">
        <!-- user icon -->
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" aria-hidden="true"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10z"/><path d="M3 20a9 9 0 0 1 18 0"/></svg>
        <div class="label">المركز الشخصي</div>
      </a>

      <a class="nav-item" href="/pages/records.html" aria-label="السجل">
        <!-- list / records icon -->
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" aria-hidden="true"><path d="M3 7h18"/><path d="M3 12h18"/><path d="M3 17h18"/></svg>
        <div class="label">السجل</div>
      </a>

      <a class="nav-item" href="/pages/position.html" aria-label="المنصب" style="flex:0 0 auto">
        <div class="center-btn" aria-hidden="true">
          <!-- lightning icon -->
          <svg viewBox="0 0 24 24" width="30" height="30" fill="none"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/></svg>
        </div>
        <div class="label">المنصب</div>
      </a>

      <a class="nav-item" href="/pages/hiring.html" aria-label="التوظيف">
        <!-- envelope / hiring icon -->
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" aria-hidden="true"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
        <div class="label">التوظيف</div>
      </a>

      <a class="nav-item" href="/pages/home.html" aria-label="الرئيسية">
        <!-- home icon -->
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" aria-hidden="true"><path d="M3 11.5L12 4l9 7.5"/><path d="M5 21V12h14v9"/></svg>
        <div class="label">الرئيسية</div>
      </a>
    </div>
  </nav>

  <script>
    // show stored user (from localStorage)
    const user = localStorage.getItem('acce_user') || '';
    document.getElementById('userName').textContent = user || 'مستخدم جديد';
  </script>
</body>
</html>
