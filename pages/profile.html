<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ACCE — المركز الشخصي</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>body{margin:0;font-family:'Cairo',sans-serif;background:linear-gradient(180deg,#f4f8fb,#eef6fb);color:#07102a}.wrap{max-width:920px;margin:20px auto;padding:18px}.nav-bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;width:420px;max-width:96%;background:linear-gradient(180deg,#0b1220,#243246);color:#fff;border-radius:14px;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:6px;box-shadow:0 12px 40px rgba(2,6,23,0.28)}.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px;text-decoration:none;color:inherit}.center-btn{background:linear-gradient(90deg,#2b82f6,#0b63c5);width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-top:-24px}</style>
</head>
<body>
  <div class="wrap">
    <h2 style="color:#0b3a66">المركز الشخصي</h2>
    <p style="color:#6b7280">صفحة المركز الشخصي — يمكنك تعديل الملف هنا.</p>
  </div>

  <nav class="nav-bottom">
    <a class="nav-item" href="/pages/home.html">الرئيسية</a>
    <a class="nav-item" href="/pages/hiring.html">التوظيف</a>
    <a class="nav-item" href="/pages/position.html"><div class="center-btn">⚡</div>المنصب</a>
    <a class="nav-item" href="/pages/records.html">السجل</a>
    <a class="nav-item" href="/pages/profile.html">المركز الشخصي</a>
  </nav>

  <script>
    // show stored user
    document.addEventListener('DOMContentLoaded', ()=>{
      const user = localStorage.getItem('acce_user') || '';
      if(user){
        const el = document.createElement('div'); el.style.margin='12px'; el.innerHTML = `<div style="background:#fff;padding:12px;border-radius:10px;box-shadow:0 6px 18px rgba(2,6,23,0.06)"><strong>المسجل:</strong> ${escapeHtml(user)}</div>`; document.querySelector('.wrap').prepend(el);
      }
    });
    function escapeHtml(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c]; }); }
  </script>
</body>
</html>
