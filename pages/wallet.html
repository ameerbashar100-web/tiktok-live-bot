<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GAYM — المحفظة</title>
  <link href="/assets/styles.css" rel="stylesheet">
</head>
<body class="dark">
  <div class="page">
    <h2>المحفظة والتداول</h2>
    <div class="wallet-card">رصيد الحساب: <div style="font-size:20px;margin-top:6px">0.00 USDT</div><div style="font-size:12px;opacity:0.9;margin-top:6px">شبكة: TRC20</div></div>
    <div class="trade-box"><canvas id="tradeChart" width="600" height="140" style="width:100%;height:140px"></canvas></div>
    <div style="margin-top:12px;text-align:right"><button id="depositBtn" class="copy-btn">شحن (Deposit)</button></div>
  </div>
  <script>
    document.getElementById('depositBtn').addEventListener('click',function(){ var addr='THJN4XBKxbZNYsw7YAHmNiZSupn3kVEDFP'; if(navigator.clipboard) navigator.clipboard.writeText(addr).then(()=>alert('تم نسخ العنوان')); else prompt('انسخ العنوان:',addr); });
    // simple chart animation
    (function(){ var c=document.getElementById('tradeChart'); if(!c) return; var ctx=c.getContext('2d'); function draw(){ ctx.clearRect(0,0,c.width,c.height); for(var i=0;i<60;i++){ var val=Math.abs(Math.sin((Date.now()/600)+(i/3))*c.height*0.45); ctx.fillStyle=(Math.random()>0.5)?'#10b981':'#ef4444'; ctx.fillRect(i*(c.width/60), c.height-val, (c.width/60)*0.8, val); } requestAnimationFrame(draw);} draw(); })();
  </script>
</body>
</html>
